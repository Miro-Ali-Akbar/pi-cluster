---
- name: Configure Raspberry Pi K3s cluster node
  hosts: localhost
  connection: local
  become: true

  vars:
    cgroup_flags: "cgroup_enable=cpuset cgroup_memory=1 cgroup_enable=memory"
    cmdline_path: /boot/firmware/cmdline.txt
    reboot_sentinel: /etc/ansible_cgroup_rebooted
    fast_storage_mount: /mnt/fast-storage
    bulk_storage_mount: /mnt/bulk-storage
    k3s_server_port: 6443
    # Fill in with the Pi 4's reserved DHCP IP before flashing the SD cards,
    # or override with --extra-vars on ansible-pull.
    pi4_local_ip: "REPLACE_WITH_PI4_IP"
    # The K3s server runs on phone-1 (provision.sh); pi4 is an agent, with its
    # old server data kept as a cold standby. Agents join and fetch the token there.
    k3s_server_ip: 192.168.0.179
    k3s_version: "v1.36.5+k3s1"
    cluster_ssh_key: /etc/rpi-cluster/id_ed25519
    # RAM-based auto-detection is just a default - real hardware doesn't always
    # match the plan's assumed SKUs (e.g. a 2GB Pi 4 doing control-plane duty).
    # Override explicitly with --extra-vars "node_role=control-plane|worker".
    node_role: "{{ 'control-plane' if ansible_memtotal_mb > 2000 else 'worker' }}"

  tasks:
    - name: Install ansible-pull-on-boot systemd unit (idempotent re-run every boot)
      ansible.builtin.copy:
        dest: /etc/systemd/system/ansible-pull.service
        mode: "0644"
        content: |
          [Unit]
          Description=Ansible pull cluster bootstrap (runs every boot)
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/bin/ansible-pull -U https://github.com/Miro-Ali-Akbar/pi-cluster.git -i localhost, rpi-cluster-ansible/local.yml --extra-vars "pi4_local_ip={{ pi4_local_ip }} node_role={{ node_role }}"

          [Install]
          WantedBy=multi-user.target
      register: ansible_pull_unit

    - name: Enable ansible-pull-on-boot service
      ansible.builtin.systemd:
        name: ansible-pull
        enabled: true
        daemon_reload: "{{ ansible_pull_unit.changed }}"

    - name: Check whether cgroup flags are already present
      ansible.builtin.command: "grep -q '{{ cgroup_flags }}' {{ cmdline_path }}"
      register: cgroup_check
      changed_when: false
      failed_when: false

    - name: Check whether we already rebooted for cgroup flags this boot generation
      ansible.builtin.stat:
        path: "{{ reboot_sentinel }}"
      register: cgroup_reboot_sentinel

    - name: Append cgroup flags to cmdline.txt
      ansible.builtin.replace:
        path: "{{ cmdline_path }}"
        regexp: '^(.*)$'
        replace: '\1 {{ cgroup_flags }}'
      when: cgroup_check.rc != 0

    - name: Record that a reboot has been requested for cgroup flags
      ansible.builtin.file:
        path: "{{ reboot_sentinel }}"
        state: touch
        mode: "0644"
      when: cgroup_check.rc != 0 and not cgroup_reboot_sentinel.stat.exists

    - name: Reboot to apply cgroup flags
      # ansible.builtin.reboot refuses to run over a local connection (it
      # assumes it would be rebooting the Ansible control node). This is a
      # local ansible-pull run on the node itself, so fire-and-forget a real
      # reboot instead - the ansible-pull-on-boot service installed above
      # picks the playbook back up on the next boot.
      ansible.builtin.command: /sbin/shutdown -r now "Applying cgroup kernel flags"
      async: 1
      poll: 0
      when: cgroup_check.rc != 0 and not cgroup_reboot_sentinel.stat.exists

    # --- Pi 4 (control plane) role ---
    - name: Control-plane role tasks
      when: node_role == 'control-plane'
      block:
        # Match by stable /dev/disk/by-id/*-0:0 path, NOT /dev/sdX - generic
        # SCSI device names aren't reserved for physical drives and can
        # collide with a Longhorn iSCSI-attached volume enumerated on the
        # same node (observed happening on a worker node's /dev/sda; only
        # avoided here so far because the real SSD happens to attach before
        # Longhorn's volume does - not a guarantee). The SSD is behind a USB
        # enclosure, so it has both a usb-* and an ata-* by-id entry;
        # matching the ata-* one is more specific (a bare "ata-" prefix
        # can't collide with a virtual SCSI/iSCSI LUN, whereas relying on
        # enumeration order can).
        - name: Find the SSD (stable by-id path)
          ansible.builtin.shell: |
            set -o pipefail
            ls -1 /dev/disk/by-id/ata-* 2>/dev/null | grep -v -- '-part' | head -1
          args:
            executable: /bin/bash
          register: ssd_byid
          changed_when: false
          failed_when: false

        - name: Fail loudly if the SSD isn't present (control plane requires it)
          ansible.builtin.assert:
            that: ssd_byid.stdout | trim | length > 0
            fail_msg: "No /dev/disk/by-id/ata-* device found - is the SSD plugged in?"

        - name: Set SSD facts
          ansible.builtin.set_fact:
            ssd_device: "{{ ssd_byid.stdout | trim }}"
            ssd_partition_path: "{{ ssd_byid.stdout | trim }}-part1"

        - name: Check for an existing partition on the SSD
          ansible.builtin.stat:
            path: "{{ ssd_partition_path }}"
          register: ssd_partition

        # The data disks carry a filesystem on the whole device (no partition
        # table) and are mounted by /etc/fstab. A missing -part1 therefore does
        # not mean "blank": never partition or format a device that already
        # holds a filesystem.
        - name: Check whether the SSD already holds a filesystem
          ansible.builtin.shell: lsblk -no FSTYPE "{{ ssd_device }}" "{{ ssd_partition_path }}" 2>/dev/null | grep -c .
          register: ssd_has_fs
          changed_when: false
          failed_when: false

        - name: Partition the SSD (whole-disk, ext4) if it is blank
          community.general.parted:
            device: "{{ ssd_device }}"
            number: 1
            state: present
            fs_type: ext4
          when: not ssd_partition.stat.exists and ssd_has_fs.stdout | trim == '0'

        - name: Format freshly-partitioned SSD as ext4
          community.general.filesystem:
            fstype: ext4
            dev: "{{ ssd_partition_path }}"
            force: true
          when: not ssd_partition.stat.exists and ssd_has_fs.stdout | trim == '0'
          register: ssd_format_fresh

        - name: Ensure SSD stays ext4 (idempotent, no force)
          community.general.filesystem:
            fstype: ext4
            dev: "{{ ssd_partition_path }}"
          when: ssd_partition.stat.exists
          register: ssd_format_existing

        - name: Create fast-storage mount point
          ansible.builtin.file:
            path: "{{ fast_storage_mount }}"
            state: directory
            mode: "0755"

        - name: Mount SSD at fast-storage
          ansible.posix.mount:
            path: "{{ fast_storage_mount }}"
            src: "{{ ssd_partition_path }}"
            fstype: ext4
            state: mounted
          when: ssd_partition.stat.exists or ssd_has_fs.stdout | trim == '0'

        # K3s server tasks: only on the node that is the server (phone-1 is, and
        # is not provisioned by this playbook), so they are skipped on pi4.
        - name: K3s server tasks (skipped unless this node is the server)
          when: ansible_default_ipv4.address == k3s_server_ip
          block:
            - name: Ensure /etc/rancher/k3s exists
              ansible.builtin.file:
                path: /etc/rancher/k3s
                state: directory
                mode: "0755"

            - name: Disable unneeded k3s bundled components (traefik, metrics-server)
              # Neither is used here (no Ingress, no HPA/kubectl top) - each is a
              # whole extra pod competing for memory on a 2GB node. This is a
              # config file, not an install flag, so it also applies on nodes
              # that were already provisioned before this was added - re-running
              # ansible-pull picks it up, just restart k3s afterward to apply.
              ansible.builtin.copy:
                dest: /etc/rancher/k3s/config.yaml
                mode: "0644"
                content: |
                  disable:
                    - traefik
                    - metrics-server

            - name: Check if K3s server is already installed
              ansible.builtin.stat:
                path: /usr/local/bin/k3s
              register: k3s_installed

            - name: Install K3s server (control plane, local-storage disabled)
              ansible.builtin.shell: |
                curl -sfL https://get.k3s.io | sh -s - --disable local-storage
              when: not k3s_installed.stat.exists

            - name: Restrict node-token to root, readable only over the trusted cluster SSH key
              ansible.builtin.file:
                path: /var/lib/rancher/k3s/server/node-token
                mode: "0600"
                owner: root
                group: root

            - name: Authorize the cluster deploy key for root-only SSH pull of the token
              ansible.posix.authorized_key:
                user: root
                key: "{{ lookup('file', cluster_ssh_key + '.pub') }}"
                key_options: 'command="cat /var/lib/rancher/k3s/server/node-token",no-port-forwarding,no-agent-forwarding,no-X11-forwarding'

    # --- Pi 3 (worker) role ---
    - name: Worker role tasks
      when: node_role == 'worker'
      block:
        # Match by stable /dev/disk/by-id/usb-* path, NOT /dev/sdX - generic
        # SCSI device names aren't reserved for physical drives, and have
        # been observed colliding with Longhorn's iSCSI-attached volume for
        # a pod's PVC (also enumerated as /dev/sda on the same node). That
        # collision once caused this block to attempt `parted --mklabel` on
        # a live, mounted Longhorn volume - it only failed to write because
        # the kernel refused ("Partition(s) on /dev/sda are being used"),
        # not because anything here detected the mismatch. by-id paths are
        # only created for genuine USB-attached disks, so this can't
        # mistake a virtual/iSCSI LUN for the physical bulk-storage drive.
        - name: Find the physical USB HDD, if attached (stable by-id path)
          ansible.builtin.shell: |
            set -o pipefail
            ls -1 /dev/disk/by-id/usb-* 2>/dev/null | grep -v -- '-part' | head -1
          args:
            executable: /bin/bash
          register: usb_hdd_byid
          changed_when: false
          failed_when: false

        - name: Set USB HDD facts
          ansible.builtin.set_fact:
            usb_hdd_present: "{{ usb_hdd_byid.stdout | trim | length > 0 }}"
            usb_hdd_device: "{{ usb_hdd_byid.stdout | trim }}"
            usb_hdd_partition: "{{ usb_hdd_byid.stdout | trim }}-part1"

        # Bulk storage is optional at join time - a worker can join the
        # cluster now and have a drive added later without re-running setup.
        - name: USB HDD storage tasks
          when: usb_hdd_present
          block:
            - name: Check for an existing partition on the USB HDD
              ansible.builtin.stat:
                path: "{{ usb_hdd_partition }}"
              register: hdd_partition

            # Data disks hold a filesystem on the whole device, mounted by
            # /etc/fstab: a missing -part1 does not mean "blank". Never
            # partition or format a device that already holds a filesystem.
            - name: Check whether the USB disk already holds a filesystem
              ansible.builtin.shell: lsblk -no FSTYPE "{{ usb_hdd_device }}" "{{ usb_hdd_partition }}" 2>/dev/null | grep -c .
              register: hdd_has_fs
              changed_when: false
              failed_when: false

            - name: Partition the USB HDD (whole-disk, ext4) if it is blank
              community.general.parted:
                device: "{{ usb_hdd_device }}"
                number: 1
                state: present
                fs_type: ext4
              when: not hdd_partition.stat.exists and hdd_has_fs.stdout | trim == '0'

            - name: Format freshly-partitioned USB HDD as ext4
              community.general.filesystem:
                fstype: ext4
                dev: "{{ usb_hdd_partition }}"
                force: true
              when: not hdd_partition.stat.exists and hdd_has_fs.stdout | trim == '0'
              register: hdd_format_fresh

            - name: Ensure USB HDD stays ext4 (idempotent, no force)
              community.general.filesystem:
                fstype: ext4
                dev: "{{ usb_hdd_partition }}"
              when: hdd_partition.stat.exists
              register: hdd_format_existing

            - name: Create bulk-storage mount point
              ansible.builtin.file:
                path: "{{ bulk_storage_mount }}"
                state: directory
                mode: "0755"

            - name: Mount USB HDD at bulk-storage
              ansible.posix.mount:
                path: "{{ bulk_storage_mount }}"
                src: "{{ usb_hdd_partition }}"
                fstype: ext4
                state: mounted
              when: hdd_partition.stat.exists or hdd_has_fs.stdout | trim == '0'

    # --- every Pi: join the cluster as an agent of the K3s server on phone-1 ---
    - name: Join K3s as an agent
      when: ansible_default_ipv4.address != k3s_server_ip
      block:
        - name: Check if the K3s agent is already installed
          ansible.builtin.stat:
            path: /etc/systemd/system/k3s-agent.service
          register: k3s_agent_installed

        - name: Fetch the node token from the server over the restricted deploy key
          ansible.builtin.command: >
            ssh -i {{ cluster_ssh_key }} -o StrictHostKeyChecking=accept-new
            root@{{ k3s_server_ip }} true
          register: worker_node_token
          changed_when: false
          when: not k3s_agent_installed.stat.exists

        - name: Join K3s cluster as agent
          ansible.builtin.shell: >
            curl -sfL https://get.k3s.io |
            INSTALL_K3S_VERSION={{ k3s_version }}
            K3S_URL=https://{{ k3s_server_ip }}:{{ k3s_server_port }}
            K3S_TOKEN={{ worker_node_token.stdout | trim }}
            sh -s - agent
          when: not k3s_agent_installed.stat.exists

    # --- pi4: only phone-1 (Home Assistant) may reach the Bluetooth proxy ---
    # bt-proxy's ESPHome API (tcp/6053, hostNetwork) has no authentication or
    # encryption, so drop connections to it from every address but the phone.
    - name: Restrict the bt-proxy API port to phone-1
      when: ansible_hostname == 'pi4'
      block:
        - name: Install the bt-proxy firewall unit
          ansible.builtin.copy:
            dest: /etc/systemd/system/bt-proxy-firewall.service
            mode: "0644"
            content: |
              [Unit]
              Description=Only phone-1 may reach the bt-proxy API (tcp/6053)
              After=network-online.target
              Wants=network-online.target

              [Service]
              Type=oneshot
              RemainAfterExit=yes
              ExecStart=/bin/sh -c 'iptables -C INPUT -p tcp --dport 6053 ! -i lo ! -s 192.168.0.179 -j DROP 2>/dev/null || iptables -I INPUT 1 -p tcp --dport 6053 ! -i lo ! -s 192.168.0.179 -j DROP; ip6tables -C INPUT -p tcp --dport 6053 -j DROP 2>/dev/null || ip6tables -I INPUT 1 -p tcp --dport 6053 -j DROP'
              ExecStop=/bin/sh -c 'iptables -D INPUT -p tcp --dport 6053 ! -i lo ! -s 192.168.0.179 -j DROP 2>/dev/null; ip6tables -D INPUT -p tcp --dport 6053 -j DROP 2>/dev/null; true'

              [Install]
              WantedBy=multi-user.target
          register: bt_proxy_firewall_unit

        - name: Enable the bt-proxy firewall unit
          ansible.builtin.systemd:
            name: bt-proxy-firewall
            enabled: true
            state: started
            daemon_reload: "{{ bt_proxy_firewall_unit.changed }}"

    # --- pi3-1 and pi3-2: SeaweedFS metadata that phone-1 pulls into /var/backups/cluster ---
    # pi3-1 holds the master, pi3-2 the filer. phone-1's key may run only this
    # export script, which streams a tar.gz to stdout.
    - name: Allow phone-1 to pull a backup archive
      when: ansible_hostname in ['pi3-1', 'pi3-2']
      block:
        - name: Install the backup export script
          ansible.builtin.copy:
            dest: /usr/local/sbin/cluster-backup-export
            mode: "0755"
            owner: root
            group: root
            content: |
              #!/bin/bash
              set -eu
              tmp=$(mktemp -d -p /var/tmp)
              trap 'rm -rf "$tmp"' EXIT
              for d in seaweedfs-master seaweedfs-filer; do
                [ -d "/mnt/longhorn-disk1/$d" ] && cp -a "/mnt/longhorn-disk1/$d" "$tmp/"
              done
              tar -C "$tmp" -czf - .

        - name: Authorize phone-1's backup key for the export script only
          ansible.posix.authorized_key:
            user: root
            key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKo3F5WEjANQ3gdQXoOKxhvuad5p/UjbiefkpXRDquCV phone-1-cluster-backup"
            key_options: 'command="/usr/local/sbin/cluster-backup-export",restrict'

    # --- pi4: standby copy of the K3s server state, pushed by phone-1 ---
    - name: Receive the K3s standby archive from phone-1
      when: ansible_hostname == 'pi4'
      block:
        - name: Install the standby receive script
          ansible.builtin.copy:
            dest: /usr/local/sbin/cluster-standby-receive
            mode: "0755"
            owner: root
            group: root
            content: |
              #!/bin/bash
              # Reads a tar.gz on stdin into /var/backups/cluster-standby, keeps the newest 14.
              set -eu
              umask 077
              d=/var/backups/cluster-standby
              mkdir -p "$d"
              out="$d/phone-1-$(date +%Y%m%d-%H%M%S).tar.gz"
              cat > "$out.part"
              tar -tzf "$out.part" > /dev/null
              mv "$out.part" "$out"
              ls -1t "$d"/*.tar.gz | tail -n +15 | xargs -r rm --

        - name: Authorize phone-1's push key for the receive script only
          ansible.posix.authorized_key:
            user: root
            key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPbH8JpkeTPOv6kGtFD8Gl2l6j0UadEG6ZyL0P4kfIUD phone-1-standby-push"
            key_options: 'command="/usr/local/sbin/cluster-standby-receive",restrict'

    # --- every Pi: disk health metrics for Prometheus, no iSCSI ---
    # SMART data from the USB SSDs goes to node-exporter's textfile collector
    # (the DaemonSet mounts /var/lib/node_exporter); alerts are in
    # rpi-cluster-gitops/apps/monitoring/prometheus-config.yaml.
    - name: Disk health metrics
      block:
        - name: Install smartmontools
          ansible.builtin.apt:
            name: smartmontools
            state: present

        - name: Install the SMART metrics script
          ansible.builtin.copy:
            dest: /usr/local/sbin/smart-metrics
            mode: "0755"
            owner: root
            group: root
            content: |
              #!/bin/bash
              # Writes SMART health, reallocated/pending sectors, temperature and power-on hours
              # of every USB disk as Prometheus textfile metrics.
              set -u
              dir=/var/lib/node_exporter
              mkdir -p "$dir"
              tmp=$(mktemp -p "$dir" .smart.XXXXXX)
              {
                for d in $(lsblk -dno NAME,TRAN | awk '$2=="usb"{print $1}'); do
                  model=$(lsblk -dno MODEL "/dev/$d" | sed 's/ *$//; s/"//g')
                  l="device=\"$d\",model=\"$model\""
                  health=$(smartctl -H -d sat "/dev/$d" 2>&1 | grep -c 'PASSED')
                  echo "smart_health_ok{$l} $health"
                  attrs=$(smartctl -A -d sat "/dev/$d" 2>&1)
                  for pair in 5:smart_reallocated_sectors 197:smart_pending_sectors 194:smart_temperature_celsius 9:smart_power_on_hours; do
                    v=$(echo "$attrs" | awk -v id="${pair%%:*}" '$1==id{print $10; exit}')
                    [ -n "$v" ] && echo "${pair##*:}{$l} $v"
                  done
                done
              } > "$tmp"
              chmod 644 "$tmp"
              mv "$tmp" "$dir/smart.prom"

        - name: Install the SMART metrics timer
          ansible.builtin.copy:
            dest: "/etc/systemd/system/{{ item.name }}"
            mode: "0644"
            content: "{{ item.content }}"
          loop:
            - name: smart-metrics.service
              content: |
                [Unit]
                Description=Write SMART disk metrics for node-exporter

                [Service]
                Type=oneshot
                ExecStart=/usr/local/sbin/smart-metrics
            - name: smart-metrics.timer
              content: |
                [Unit]
                Description=SMART disk metrics every 10 minutes

                [Timer]
                OnBootSec=2min
                OnUnitActiveSec=10min

                [Install]
                WantedBy=timers.target
          register: smart_units

        - name: Enable the SMART metrics timer
          ansible.builtin.systemd:
            name: smart-metrics.timer
            enabled: true
            state: started
            daemon_reload: "{{ smart_units.changed }}"

        - name: Remove open-iscsi (left over from Longhorn, no sessions)
          ansible.builtin.apt:
            name: open-iscsi
            state: absent
            purge: true
            autoremove: true

    # --- every Pi: failed-unit metrics, so a silently failing ansible-pull shows up in Prometheus ---
    - name: Unit health metrics
      block:
        - name: Install the unit health script
          ansible.builtin.copy:
            dest: /usr/local/sbin/unit-health
            mode: "0755"
            owner: root
            group: root
            content: |
              #!/bin/bash
              # Failed state and last exit time of the systemd units given as arguments, for node-exporter's
              # textfile collector (/var/lib/node_exporter/units.prom).
              set -u
              dir=/var/lib/node_exporter
              mkdir -p "$dir"
              tmp=$(mktemp -p "$dir" .units.XXXXXX)
              {
                for u in "$@"; do
                  failed=0
                  [ "$(systemctl is-failed "$u" 2>/dev/null)" = failed ] && failed=1
                  ts=$(systemctl show "$u" -p ExecMainExitTimestamp --value 2>/dev/null)
                  epoch=0
                  [ -n "$ts" ] && epoch=$(date -d "$ts" +%s 2>/dev/null || echo 0)
                  echo "unit_failed{unit=\"$u\"} $failed"
                  echo "unit_last_exit_timestamp_seconds{unit=\"$u\"} $epoch"
                done
              } > "$tmp"
              chmod 644 "$tmp"
              mv "$tmp" "$dir/units.prom"

        - name: Install the unit health timer
          ansible.builtin.copy:
            dest: "/etc/systemd/system/{{ item.name }}"
            mode: "0644"
            content: "{{ item.content }}"
          loop:
            - name: unit-health.service
              content: |
                [Unit]
                Description=Write systemd unit health for node-exporter

                [Service]
                Type=oneshot
                ExecStart=/usr/local/sbin/unit-health ansible-pull.service smart-metrics.service
            - name: unit-health.timer
              content: |
                [Unit]
                Description=Unit health metrics every minute

                [Timer]
                OnBootSec=1min
                OnUnitActiveSec=1min

                [Install]
                WantedBy=timers.target
          register: unit_health_units

        - name: Enable the unit health timer
          ansible.builtin.systemd:
            name: unit-health.timer
            enabled: true
            state: started
            daemon_reload: "{{ unit_health_units.changed }}"

    # --- pi4: IPv6 forwarding for the OpenThread border router ---
    # OTBR routes between the LAN (eth0) and the Thread mesh (wpan0). Without forwarding, hosts on the
    # LAN (matter-server on phone-1) cannot reach Thread devices through it.
    - name: Enable IPv6 forwarding for OTBR
      when: ansible_hostname == 'pi4'
      ansible.posix.sysctl:
        name: net.ipv6.conf.all.forwarding
        value: "1"
        sysctl_file: /etc/sysctl.d/90-otbr-forwarding.conf
        state: present
        reload: true
