---
- name: Configure Raspberry Pi K3s cluster node
  hosts: localhost
  connection: local
  become: true

  vars:
    cgroup_flags: "cgroup_enable=cpuset cgroup_memory=1 cgroup_enable=memory"
    cmdline_path: /boot/firmware/cmdline.txt
    reboot_sentinel: /etc/ansible_cgroup_rebooted
    fast_storage_mount: /mnt/fast-storage
    bulk_storage_mount: /mnt/bulk-storage
    k3s_server_port: 6443
    # Fill in with the Pi 4's reserved DHCP IP before flashing the SD cards,
    # or override with --extra-vars on ansible-pull.
    pi4_local_ip: "REPLACE_WITH_PI4_IP"
    cluster_ssh_key: /etc/rpi-cluster/id_ed25519
    # Public half of the dedicated key Home Assistant's cast-stack toggle
    # switch uses to reach pi3-2 - restricted via forced command below to
    # exactly this one action, nothing else. Never the cluster_ssh_key above
    # (that one can pull node-join tokens - a compromised HA instance
    # shouldn't inherit that).
    ha_cast_toggle_pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJBvgele3xI9YIhLH8+hn+xjjENvygMN0MIxNxXHPAnS ha-cast-toggle"
    # RAM-based auto-detection is just a default - real hardware doesn't always
    # match the plan's assumed SKUs (e.g. a 2GB Pi 4 doing control-plane duty).
    # Override explicitly with --extra-vars "node_role=control-plane|worker".
    node_role: "{{ 'control-plane' if ansible_memtotal_mb > 2000 else 'worker' }}"

  tasks:
    - name: Install ansible-pull-on-boot systemd unit (idempotent re-run every boot)
      ansible.builtin.copy:
        dest: /etc/systemd/system/ansible-pull.service
        mode: "0644"
        content: |
          [Unit]
          Description=Ansible pull cluster bootstrap (runs every boot)
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/bin/ansible-pull -U https://github.com/Miro-Ali-Akbar/pi-cluster.git -i localhost, rpi-cluster-ansible/local.yml --extra-vars "pi4_local_ip={{ pi4_local_ip }} node_role={{ node_role }}"

          [Install]
          WantedBy=multi-user.target
      register: ansible_pull_unit

    - name: Enable ansible-pull-on-boot service
      ansible.builtin.systemd:
        name: ansible-pull
        enabled: true
        daemon_reload: "{{ ansible_pull_unit.changed }}"

    - name: Install open-iscsi (required by Longhorn)
      ansible.builtin.apt:
        name: open-iscsi
        state: present
        update_cache: true

    - name: Enable and start iscsid
      ansible.builtin.systemd:
        name: iscsid
        enabled: true
        state: started

    - name: Check whether cgroup flags are already present
      ansible.builtin.command: "grep -q '{{ cgroup_flags }}' {{ cmdline_path }}"
      register: cgroup_check
      changed_when: false
      failed_when: false

    - name: Check whether we already rebooted for cgroup flags this boot generation
      ansible.builtin.stat:
        path: "{{ reboot_sentinel }}"
      register: cgroup_reboot_sentinel

    - name: Append cgroup flags to cmdline.txt
      ansible.builtin.replace:
        path: "{{ cmdline_path }}"
        regexp: '^(.*)$'
        replace: '\1 {{ cgroup_flags }}'
      when: cgroup_check.rc != 0

    - name: Record that a reboot has been requested for cgroup flags
      ansible.builtin.file:
        path: "{{ reboot_sentinel }}"
        state: touch
        mode: "0644"
      when: cgroup_check.rc != 0 and not cgroup_reboot_sentinel.stat.exists

    - name: Reboot to apply cgroup flags
      # ansible.builtin.reboot refuses to run over a local connection (it
      # assumes it would be rebooting the Ansible control node). This is a
      # local ansible-pull run on the node itself, so fire-and-forget a real
      # reboot instead - the ansible-pull-on-boot service installed above
      # picks the playbook back up on the next boot.
      ansible.builtin.command: /sbin/shutdown -r now "Applying cgroup kernel flags"
      async: 1
      poll: 0
      when: cgroup_check.rc != 0 and not cgroup_reboot_sentinel.stat.exists

    # --- Pi 4 (control plane) role ---
    - name: Control-plane role tasks
      when: node_role == 'control-plane'
      block:
        # Match by stable /dev/disk/by-id/*-0:0 path, NOT /dev/sdX - generic
        # SCSI device names aren't reserved for physical drives and can
        # collide with a Longhorn iSCSI-attached volume enumerated on the
        # same node (observed happening on a worker node's /dev/sda; only
        # avoided here so far because the real SSD happens to attach before
        # Longhorn's volume does - not a guarantee). The SSD is behind a USB
        # enclosure, so it has both a usb-* and an ata-* by-id entry;
        # matching the ata-* one is more specific (a bare "ata-" prefix
        # can't collide with a virtual SCSI/iSCSI LUN, whereas relying on
        # enumeration order can).
        - name: Find the SSD (stable by-id path)
          ansible.builtin.shell: |
            set -o pipefail
            ls -1 /dev/disk/by-id/ata-* 2>/dev/null | grep -v -- '-part' | head -1
          args:
            executable: /bin/bash
          register: ssd_byid
          changed_when: false
          failed_when: false

        - name: Fail loudly if the SSD isn't present (control plane requires it)
          ansible.builtin.assert:
            that: ssd_byid.stdout | trim | length > 0
            fail_msg: "No /dev/disk/by-id/ata-* device found - is the SSD plugged in?"

        - name: Set SSD facts
          ansible.builtin.set_fact:
            ssd_device: "{{ ssd_byid.stdout | trim }}"
            ssd_partition_path: "{{ ssd_byid.stdout | trim }}-part1"

        - name: Check for an existing partition on the SSD
          ansible.builtin.stat:
            path: "{{ ssd_partition_path }}"
          register: ssd_partition

        - name: Partition the SSD (whole-disk, ext4) if none exists yet
          community.general.parted:
            device: "{{ ssd_device }}"
            number: 1
            state: present
            fs_type: ext4
          when: not ssd_partition.stat.exists

        - name: Format freshly-partitioned SSD as ext4 (wipe any stale signature)
          community.general.filesystem:
            fstype: ext4
            dev: "{{ ssd_partition_path }}"
            # Repurposing external drives for cluster storage - a prior
            # filesystem signature (e.g. leftover NTFS) is expected on first
            # use. Only force here, on a partition we just created - never on
            # later idempotent re-runs, where the drive is likely mounted and
            # in active use.
            force: true
          when: not ssd_partition.stat.exists
          register: ssd_format_fresh

        - name: Ensure SSD stays ext4 (idempotent, no force)
          community.general.filesystem:
            fstype: ext4
            dev: "{{ ssd_partition_path }}"
          when: ssd_partition.stat.exists
          register: ssd_format_existing

        - name: Create fast-storage mount point
          ansible.builtin.file:
            path: "{{ fast_storage_mount }}"
            state: directory
            mode: "0755"

        - name: Mount SSD at fast-storage
          ansible.posix.mount:
            path: "{{ fast_storage_mount }}"
            src: "{{ ssd_partition_path }}"
            fstype: ext4
            state: mounted

        - name: Ensure /etc/rancher/k3s exists
          ansible.builtin.file:
            path: /etc/rancher/k3s
            state: directory
            mode: "0755"

        - name: Disable unneeded k3s bundled components (traefik, metrics-server)
          # Neither is used here (no Ingress, no HPA/kubectl top) - each is a
          # whole extra pod competing for memory on a 2GB node. This is a
          # config file, not an install flag, so it also applies on nodes
          # that were already provisioned before this was added - re-running
          # ansible-pull picks it up, just restart k3s afterward to apply.
          ansible.builtin.copy:
            dest: /etc/rancher/k3s/config.yaml
            mode: "0644"
            content: |
              disable:
                - traefik
                - metrics-server

        - name: Check if K3s server is already installed
          ansible.builtin.stat:
            path: /usr/local/bin/k3s
          register: k3s_installed

        - name: Install K3s server (control plane, local-storage disabled)
          ansible.builtin.shell: |
            curl -sfL https://get.k3s.io | sh -s - --disable local-storage
          when: not k3s_installed.stat.exists

        - name: Restrict node-token to root, readable only over the trusted cluster SSH key
          ansible.builtin.file:
            path: /var/lib/rancher/k3s/server/node-token
            mode: "0600"
            owner: root
            group: root

        - name: Authorize the cluster deploy key for root-only SSH pull of the token
          ansible.posix.authorized_key:
            user: root
            key: "{{ lookup('file', cluster_ssh_key + '.pub') }}"
            key_options: 'command="cat /var/lib/rancher/k3s/server/node-token",no-port-forwarding,no-agent-forwarding,no-X11-forwarding'

    # --- Pi 3 (worker) role ---
    - name: Worker role tasks
      when: node_role == 'worker'
      block:
        # Match by stable /dev/disk/by-id/usb-* path, NOT /dev/sdX - generic
        # SCSI device names aren't reserved for physical drives, and have
        # been observed colliding with Longhorn's iSCSI-attached volume for
        # a pod's PVC (also enumerated as /dev/sda on the same node). That
        # collision once caused this block to attempt `parted --mklabel` on
        # a live, mounted Longhorn volume - it only failed to write because
        # the kernel refused ("Partition(s) on /dev/sda are being used"),
        # not because anything here detected the mismatch. by-id paths are
        # only created for genuine USB-attached disks, so this can't
        # mistake a virtual/iSCSI LUN for the physical bulk-storage drive.
        - name: Find the physical USB HDD, if attached (stable by-id path)
          ansible.builtin.shell: |
            set -o pipefail
            ls -1 /dev/disk/by-id/usb-* 2>/dev/null | grep -v -- '-part' | head -1
          args:
            executable: /bin/bash
          register: usb_hdd_byid
          changed_when: false
          failed_when: false

        - name: Set USB HDD facts
          ansible.builtin.set_fact:
            usb_hdd_present: "{{ usb_hdd_byid.stdout | trim | length > 0 }}"
            usb_hdd_device: "{{ usb_hdd_byid.stdout | trim }}"
            usb_hdd_partition: "{{ usb_hdd_byid.stdout | trim }}-part1"

        # Bulk storage is optional at join time - a worker can join the
        # cluster now and have a drive added later without re-running setup.
        - name: USB HDD storage tasks
          when: usb_hdd_present
          block:
            - name: Check for an existing partition on the USB HDD
              ansible.builtin.stat:
                path: "{{ usb_hdd_partition }}"
              register: hdd_partition

            - name: Partition the USB HDD (whole-disk, ext4) if none exists yet
              community.general.parted:
                device: "{{ usb_hdd_device }}"
                number: 1
                state: present
                fs_type: ext4
              when: not hdd_partition.stat.exists

            - name: Format freshly-partitioned USB HDD as ext4 (wipe any stale signature)
              community.general.filesystem:
                fstype: ext4
                dev: "{{ usb_hdd_partition }}"
                # Only force on a partition we just created - never on later
                # idempotent re-runs, where the drive is likely mounted.
                force: true
              when: not hdd_partition.stat.exists
              register: hdd_format_fresh

            - name: Ensure USB HDD stays ext4 (idempotent, no force)
              community.general.filesystem:
                fstype: ext4
                dev: "{{ usb_hdd_partition }}"
              when: hdd_partition.stat.exists
              register: hdd_format_existing

            - name: Create bulk-storage mount point
              ansible.builtin.file:
                path: "{{ bulk_storage_mount }}"
                state: directory
                mode: "0755"

            - name: Mount USB HDD at bulk-storage
              ansible.posix.mount:
                path: "{{ bulk_storage_mount }}"
                src: "{{ usb_hdd_partition }}"
                fstype: ext4
                state: mounted

        - name: Check if K3s agent is already installed
          ansible.builtin.stat:
            path: /usr/local/bin/k3s-agent
          register: k3s_agent_installed

        - name: Fetch node token from the control plane over the restricted deploy key
          ansible.builtin.command: >
            ssh -i {{ cluster_ssh_key }} -o StrictHostKeyChecking=accept-new
            root@{{ pi4_local_ip }} true
          register: worker_node_token
          changed_when: false
          when: not k3s_agent_installed.stat.exists

        - name: Join K3s cluster as agent
          ansible.builtin.shell: >
            curl -sfL https://get.k3s.io |
            K3S_URL=https://{{ pi4_local_ip }}:{{ k3s_server_port }}
            K3S_TOKEN={{ worker_node_token.stdout | trim }}
            sh -s - agent
          when: not k3s_agent_installed.stat.exists

    # --- pi3-2: notify Home Assistant on every boot ---
    # Mainly to know when bluetooth-watchdog's auto-reboot actually fires,
    # without having to notice the speaker went quiet. Uses a webhook
    # (no auth token to manage) into an HA automation
    # (pi3_2_boot_notify in automations.yaml) that posts a
    # persistent_notification.
    - name: Notify Home Assistant when pi3-2 boots
      when: ansible_hostname == 'pi3-2'
      block:
        - name: Install the boot-notify systemd unit
          ansible.builtin.copy:
            dest: /etc/systemd/system/boot-notify.service
            mode: "0644"
            content: |
              [Unit]
              Description=Notify Home Assistant that this node booted
              After=network-online.target
              Wants=network-online.target

              [Service]
              Type=oneshot
              ExecStart=/usr/bin/curl -s -X POST --max-time 10 http://192.168.0.174:8123/api/webhook/efd1794d752b7432f3fc69042eb20fdf

              [Install]
              WantedBy=multi-user.target
          register: boot_notify_unit

        - name: Enable boot-notify
          ansible.builtin.systemd:
            name: boot-notify
            enabled: true
            daemon_reload: "{{ boot_notify_unit.changed }}"

    # --- pi3-2: persistent journal ---
    # Raspberry Pi OS ships a vendor drop-in
    # (/usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf)
    # forcing Storage=volatile specifically to reduce SD card wear -
    # creating /var/log/journal alone doesn't override it, since that
    # drop-in wins regardless. Overriding it anyway: a reboot (including
    # bluetooth-watchdog's own) otherwise wipes the evidence of what
    # caused it, which defeats the point of having the watchdog log
    # anything. Trade-off accepted: somewhat more SD card writes.
    - name: Persistent journal (survive reboots - needed to debug the Bluetooth watchdog)
      when: ansible_hostname == 'pi3-2'
      block:
        - name: Remove the wrongly-sorted first attempt at this override
          ansible.builtin.file:
            path: /etc/systemd/journald.conf.d/00-persistent-storage.conf
            state: absent

        - name: Create /var/log/journal
          ansible.builtin.file:
            path: /var/log/journal
            state: directory
            mode: "0755"

        - name: Create journald config drop-in directory
          ansible.builtin.file:
            path: /etc/systemd/journald.conf.d
            state: directory
            mode: "0755"

        # Drop-ins from /etc/ and /usr/lib/ merge into ONE filename-sorted
        # list, later files winning per-key - "00-" sorted before the
        # vendor's "40-rpi-volatile-storage.conf" and lost. Must sort after
        # it to actually win.
        - name: Override the vendor's volatile-storage default
          ansible.builtin.copy:
            dest: /etc/systemd/journald.conf.d/99-persistent-storage.conf
            mode: "0644"
            content: |
              [Journal]
              Storage=persistent
          register: journald_override

        - name: Restart systemd-journald to switch to persistent storage
          ansible.builtin.systemd:
            name: systemd-journald
            state: restarted
          when: journald_override.changed

    # --- pi3-2: remove the old multi-source cast stack ---
    # snapclient/snapserver/shairport-sync/gmediarender, and their
    # associated config/watchdog files, from when this ran AirPlay+DLNA+PC
    # audio+Spotify all auto-switching through a Snapcast meta-stream.
    # Explicit `absent` rather than just no-op-ing on a fresh node, so a
    # stale node re-running this actually gets them removed too.
    - name: Remove the old multi-source cast stack
      when: ansible_hostname == 'pi3-2'
      block:
        - name: Remove snapclient, snapserver, shairport-sync, gmediarender
          ansible.builtin.apt:
            name:
              - snapclient
              - snapserver
              - shairport-sync
              - gmediarender
            state: absent
            purge: true

        - name: Remove their leftover config/unit/watchdog files
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/systemd/system/gmediarender.service
            - /etc/systemd/system/snapclient-watchdog.service
            - /etc/systemd/system/snapclient-watchdog.timer
            - /usr/local/bin/snapclient-watchdog.sh
            - /etc/systemd/system/raspotify.service.d/override.conf
            - /etc/tmpfiles.d/castpipes.conf
            - /run/castpipes
            - /etc/snapserver.conf

    # --- pi3-2: onboard Bluetooth audio-out (paired dumb BT speakers) ---
    # Runs natively on the host, not as a k8s pod - bluealsa needs to own
    # the "org.bluealsa" name on the host's real system D-Bus, and the
    # host's default D-Bus security policy denies that to a container
    # process even running as root (confirmed by testing directly - it's
    # not a bug, it's the policy working as intended). A pod would need a
    # policy file dropped into /etc/dbus-1/system.d/ on the host anyway, at
    # which point there's no benefit over just installing the real package.
    - name: Bluetooth audio (bluealsa) tasks
      when: ansible_hostname == 'pi3-2'
      block:
        - name: Install bluez-alsa-utils
          ansible.builtin.apt:
            name: bluez-alsa-utils
            state: present
            update_cache: true

        - name: Install bluealsa systemd unit (A2DP source - streams audio out to paired speakers)
          ansible.builtin.copy:
            dest: /etc/systemd/system/bluealsa.service
            mode: "0644"
            content: |
              [Unit]
              Description=BlueALSA (A2DP source for streaming to paired Bluetooth speakers)
              After=bluetooth.service dbus.service
              Requires=bluetooth.service

              [Service]
              ExecStart=/usr/bin/bluealsa -p a2dp-source
              Restart=on-failure

              [Install]
              WantedBy=multi-user.target
          register: bluealsa_unit

        - name: Enable and start bluealsa
          ansible.builtin.systemd:
            name: bluealsa
            enabled: true
            state: started
            daemon_reload: "{{ bluealsa_unit.changed }}"

    # --- pi3-2: Spotify Connect casting, gated by an HA switch ---
    # Just raspotify (librespot) -> bluealsa -> speaker, no Snapcast layer.
    # An earlier version of this ran a full multi-source stack (AirPlay,
    # DLNA, PC audio, all auto-switching via a Snapcast meta-stream) - cut
    # back to Spotify-only per request, since Snapcast's 400ms sync buffer
    # was pure overhead once there was only ever one source to arbitrate.
    #
    # Off by default: the speaker is a normal Bluetooth device (free for a
    # phone to pair directly) until the "Speaker Cast Stack" HA switch
    # explicitly turns raspotify on and connects it. bluealsa itself stays
    # enabled/running always - it doesn't hold any connection to the
    # speaker on its own, it's just idle until something (raspotify) uses
    # it, so it doesn't conflict with a phone pairing directly.
    - name: Spotify Connect casting tasks
      when: ansible_hostname == 'pi3-2'
      block:
        - name: Add raspotify's signed apt key
          ansible.builtin.get_url:
            url: https://dtcooper.github.io/raspotify/key.asc
            dest: /usr/share/keyrings/raspotify_key.asc
            mode: "0644"

        - name: Add raspotify's apt repository
          ansible.builtin.copy:
            dest: /etc/apt/sources.list.d/raspotify.list
            mode: "0644"
            content: "deb [signed-by=/usr/share/keyrings/raspotify_key.asc] https://dtcooper.github.io/raspotify raspotify main\n"
          register: raspotify_repo

        - name: Install raspotify (Spotify Connect, via librespot)
          ansible.builtin.apt:
            name: raspotify
            state: present
            update_cache: "{{ raspotify_repo.changed }}"

        - name: Point raspotify straight at bluealsa, name the device
          ansible.builtin.lineinfile:
            path: /etc/raspotify/conf
            regexp: "{{ item.regexp }}"
            line: "{{ item.line }}"
          loop:
            - regexp: '^#?LIBRESPOT_BACKEND=(alsa)?$'
              line: "LIBRESPOT_BACKEND=alsa"
            - regexp: '^#?LIBRESPOT_DEVICE=(bluealsa:DEV=93:30:5A:9B:22:F9,PROFILE=a2dp)?$'
              line: "LIBRESPOT_DEVICE=bluealsa:DEV=93:30:5A:9B:22:F9,PROFILE=a2dp"
            - regexp: '^#?LIBRESPOT_NAME=("Librespot"|"Big Speaker Sound In")$'
              line: 'LIBRESPOT_NAME="Big Speaker Sound In"'
          register: raspotify_conf

        - name: Restart raspotify if config changed (default is off - see below)
          ansible.builtin.systemd:
            name: raspotify
            state: restarted
          when: raspotify_conf.changed

        # Deliberately enabled: false / not force-started - off is the
        # default, only the HA switch (forced-command SSH below) turns it
        # on. Ansible only touches its enabled-at-boot state here, never
        # its running state, so a live "on" toggle survives a config-only
        # ansible-pull run - only an actual reboot (which drops the
        # Bluetooth connection anyway) resets it to the off default.
        - name: Ensure raspotify doesn't auto-start at boot
          ansible.builtin.systemd:
            name: raspotify
            enabled: false

        # Lets a Home Assistant switch free the speaker for direct phone
        # pairing: stopping raspotify alone isn't enough, since BlueZ keeps
        # the ACL connection up independent of it - the speaker stays
        # unavailable to any other device until it's explicitly
        # disconnected too.
        - name: Install the cast toggle script (root-only, forced-command restricted)
          ansible.builtin.copy:
            dest: /usr/local/bin/ha-cast-toggle.sh
            mode: "0700"
            content: |
              #!/bin/bash
              set -euo pipefail
              SPEAKER_MAC="93:30:5A:9B:22:F9"
              case "${SSH_ORIGINAL_COMMAND:-}" in
                cast-stack-stop)
                  systemctl stop raspotify
                  bluetoothctl disconnect "$SPEAKER_MAC" || true
                  ;;
                cast-stack-start)
                  bluetoothctl connect "$SPEAKER_MAC" || true
                  sleep 2
                  systemctl start raspotify
                  ;;
                cast-stack-status)
                  systemctl is-active raspotify
                  ;;
                *)
                  echo "unrecognized command" >&2
                  exit 1
                  ;;
              esac

        - name: Authorize Home Assistant's cast-toggle key (root, forced command only)
          ansible.posix.authorized_key:
            user: root
            key: "{{ ha_cast_toggle_pubkey }}"
            key_options: 'command="/usr/local/bin/ha-cast-toggle.sh",no-port-forwarding,no-agent-forwarding,no-X11-forwarding,no-pty'

        # pi3-2's onboard Bluetooth chip has hardware-faulted twice
        # ("hardware error 0x00", even the reset command times out) -
        # traced to undervoltage (confirmed via dmesg). A proper PSU/cable
        # is the real fix; this is a safety net until then. A plain
        # service restart doesn't clear the fault - only a reboot has, in
        # both observed cases - so this escalates to one if a soft
        # power-on doesn't recover it.
        - name: Install the Bluetooth adapter watchdog script
          ansible.builtin.copy:
            dest: /usr/local/bin/bluetooth-watchdog.sh
            mode: "0755"
            content: |
              #!/bin/bash
              if bluetoothctl show | grep -q "Powered: yes"; then
                  exit 0
              fi
              bluetoothctl power on >/dev/null 2>&1
              sleep 2
              if bluetoothctl show | grep -q "Powered: yes"; then
                  exit 0
              fi
              systemctl reboot
          register: bluetooth_watchdog_script

        - name: Install the Bluetooth adapter watchdog timer
          ansible.builtin.copy:
            dest: "/etc/systemd/system/bluetooth-watchdog.{{ item }}"
            mode: "0644"
            content: "{{ bluetooth_watchdog_units[item] }}"
          loop:
            - service
            - timer
          vars:
            bluetooth_watchdog_units:
              service: |
                [Unit]
                Description=Recover the Bluetooth adapter if it's not powered (reboot if a soft recovery fails)

                [Service]
                Type=oneshot
                ExecStart=/usr/local/bin/bluetooth-watchdog.sh
              timer: |
                [Unit]
                Description=Periodically check the Bluetooth adapter is actually powered

                [Timer]
                OnUnitActiveSec=2min
                OnBootSec=2min

                [Install]
                WantedBy=timers.target
          register: bluetooth_watchdog_units_installed

        - name: Enable and start the Bluetooth adapter watchdog timer
          ansible.builtin.systemd:
            name: bluetooth-watchdog.timer
            enabled: true
            state: started
            daemon_reload: "{{ bluetooth_watchdog_units_installed.changed }}"
