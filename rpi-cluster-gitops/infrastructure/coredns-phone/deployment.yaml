# Second CoreDNS replica on phone-1. K3s manages the packaged `coredns`
# deployment (single replica, overwritten on upgrade), so this is a separate
# deployment that reuses its ConfigMap and ServiceAccount. The `kube-dns`
# Service selects pods by `k8s-app: kube-dns`, so the pod below becomes a second
# endpoint automatically. Cluster DNS then survives the other replica's node
# going NotReady.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coredns-phone
  namespace: kube-system
  labels:
    app: coredns-phone
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coredns-phone
  template:
    metadata:
      labels:
        app: coredns-phone
        k8s-app: kube-dns
    spec:
      serviceAccountName: coredns
      priorityClassName: system-cluster-critical
      dnsPolicy: Default
      nodeSelector:
        kubernetes.io/hostname: phone-1
      tolerations:
        - key: node-type
          operator: Equal
          value: phone
          effect: NoSchedule
        - key: CriticalAddonsOnly
          operator: Exists
      containers:
        - name: coredns
          image: rancher/mirrored-coredns-coredns:1.14.6
          args: ["-conf", "/etc/coredns/Corefile"]
          ports:
            - {name: dns, containerPort: 53, protocol: UDP}
            - {name: dns-tcp, containerPort: 53, protocol: TCP}
            - {name: metrics, containerPort: 9153, protocol: TCP}
          resources:
            requests:
              cpu: 100m
              memory: 70Mi
            limits:
              memory: 170Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add: ["NET_BIND_SERVICE"]
              drop: ["all"]
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet: {path: /health, port: 8080, scheme: HTTP}
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /ready, port: 8181, scheme: HTTP}
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 3
          volumeMounts:
            - {name: config-volume, mountPath: /etc/coredns, readOnly: true}
            - {name: custom-config-volume, mountPath: /etc/coredns/custom, readOnly: true}
      volumes:
        - name: config-volume
          configMap:
            name: coredns
            items:
              - {key: Corefile, path: Corefile}
              - {key: NodeHosts, path: NodeHosts}
        - name: custom-config-volume
          configMap:
            name: coredns-custom
            optional: true
