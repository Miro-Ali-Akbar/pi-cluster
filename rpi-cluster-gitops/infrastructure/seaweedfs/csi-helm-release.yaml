# SeaweedFS CSI driver - lets apps consume SeaweedFS storage as ordinary
# PVCs. Excludes pi3-1 (only 905Mi RAM, already carrying SeaweedFS's
# master/filer/volume-server plus matter-server/otbr/zigbee-bridge) - the
# CSI node driver and mount-service DaemonSets add real per-node overhead
# none of the SeaweedFS-consuming apps need a hardware reason to accept.
#
# Every container below has an explicit resource limit - the chart's own
# defaults are unbounded.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs-csi-driver
  namespace: seaweedfs
spec:
  interval: 1h
  # mountService's DaemonSet uses OnDelete (see values below) so it never
  # auto-rolls on a chart change and disrupts active mounts - pods pick up
  # new settings only once manually deleted. Helm's post-upgrade rollout
  # wait doesn't know that's expected and times out, so disableWait skips
  # it; consumer pods need a manual restart afterward regardless.
  install:
    disableWait: true
  upgrade:
    disableWait: true
  chart:
    spec:
      chart: seaweedfs-csi-driver
      version: "0.2.x"
      sourceRef:
        kind: HelmRepository
        name: seaweedfs-csi-driver
        namespace: seaweedfs
  values:
    seaweedfsFiler: "seaweedfs-filer.seaweedfs.svc.cluster.local:8888"
    storageClassName: seaweedfs-storage
    isDefaultStorageClass: false

    # Default concurrentWriters/Readers (128 each) are tuned for real
    # servers, not a Pi 3 with ~900Mi RAM shared across several mounted
    # PVCs - too many simultaneous in-flight writes OOM-kills the mount
    # process, leaving every pod using that node's SeaweedFS storage with
    # a dead "transport endpoint not connected" mount. Mount cache is left
    # at its default (disabled) for the same reason - a per-mount cache
    # across several PVCs on one node adds up past the mount service's own
    # memory limit.
    concurrentWriters: 2
    concurrentReaders: 2

    controller:
      replicas: 1
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["pi4", "pi3-2"]
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          memory: 96Mi

    csiProvisioner:
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          memory: 96Mi

    csiResizer:
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          memory: 96Mi

    csiAttacher:
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          memory: 96Mi

    csiNodeDriverRegistrar:
      resources:
        requests:
          cpu: 25m
          memory: 24Mi
        limits:
          memory: 64Mi

    csiLivenessProbe:
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi

    node:
      enabled: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["pi4", "pi3-2"]

    mountService:
      enabled: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["pi4", "pi3-2"]
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 192Mi

    seaweedfsCsiPlugin:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 160Mi
