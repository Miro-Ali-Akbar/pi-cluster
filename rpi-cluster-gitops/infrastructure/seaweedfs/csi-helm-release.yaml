# SeaweedFS CSI driver - lets apps consume SeaweedFS storage as ordinary
# PVCs. Deliberately excludes pi3-1: that node is already carrying
# SeaweedFS's master/filer/volume-server plus matter-server/otbr/zigbee-bridge
# on only 905Mi RAM (see today's memory crisis in plan.md), and this chart
# deploys a DaemonSet on every included node (CSI node driver + a separate
# mount-service DaemonSet), each with several sidecar containers - real
# additional overhead per node. None of the apps that will use SeaweedFS
# storage (home-assistant, web-server, site-counters, nas-samba) have a
# hardware reason to run on pi3-1, so they're relocated to pi4/pi3-2 instead.
#
# Every container below gets an explicit resource limit - the chart's
# defaults are unbounded (resources: {}), which is exactly the kind of
# unconstrained footprint that caused today's crisis with Flux and Longhorn.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs-csi-driver
  namespace: seaweedfs
spec:
  interval: 1h
  # mountService's DaemonSet intentionally uses OnDelete (see values below) so
  # it never auto-rolls on a chart change - pods only pick up new mount
  # settings once manually deleted, on purpose, to avoid disrupting active
  # mounts mid-upgrade. Helm's default post-upgrade "wait for rollout" has
  # no way to know that's expected, so it times out and fails every single
  # upgrade regardless of what changed. disableWait skips that wait; the
  # actual resources still apply correctly (verified separately), and
  # consumer pods just need a manual restart afterward to pick up changes -
  # which they'd need anyway given OnDelete.
  install:
    disableWait: true
  upgrade:
    disableWait: true
  chart:
    spec:
      chart: seaweedfs-csi-driver
      version: "0.2.x"
      sourceRef:
        kind: HelmRepository
        name: seaweedfs-csi-driver
        namespace: seaweedfs
  values:
    seaweedfsFiler: "seaweedfs-filer.seaweedfs.svc.cluster.local:8888"
    storageClassName: seaweedfs-storage
    isDefaultStorageClass: false

    # Default concurrentWriters/Readers (128 each) are tuned for real
    # servers, not a Pi 3 with ~900Mi RAM shared across several mounted
    # PVCs. A bulk upload would open many simultaneous in-flight writes,
    # each with buffers/goroutines the mount process couldn't afford -
    # it'd get OOM-killed, leaving every pod using SeaweedFS storage on
    # that node with a dead "transport endpoint not connected" mount until
    # manually restarted (this is what took down the NAS, web-server, and
    # site-counters at once). Lowering concurrency directly throttles how
    # much a bulk transfer can pile on at once. Deliberately leaving the
    # mount cache at its default (disabled) rather than adding one - with
    # multiple PVCs mounted per node, even a modest per-mount cache could
    # add up past the mount service's own memory limit and cause the exact
    # OOM this is meant to prevent.
    concurrentWriters: 8
    concurrentReaders: 8

    controller:
      replicas: 1
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["pi4", "pi3-2"]
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          memory: 96Mi

    csiProvisioner:
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          memory: 96Mi

    csiResizer:
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          memory: 96Mi

    csiAttacher:
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          memory: 96Mi

    csiNodeDriverRegistrar:
      resources:
        requests:
          cpu: 25m
          memory: 24Mi
        limits:
          memory: 64Mi

    csiLivenessProbe:
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi

    node:
      enabled: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["pi4", "pi3-2"]

    mountService:
      enabled: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["pi4", "pi3-2"]
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 192Mi

    seaweedfsCsiPlugin:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 160Mi
