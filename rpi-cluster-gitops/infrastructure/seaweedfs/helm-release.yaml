# Master + filer are pinned to pi3-1 rather than pi4: pi4 already carries
# the k3s control-plane and Home Assistant, so it has less real headroom
# than its total RAM suggests. Volume servers run once per physical disk -
# pi4 hosts three (two SSDs plus the original WD "fast storage" disk),
# since data has to live where the disk physically is.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs
  namespace: seaweedfs
spec:
  interval: 1h
  chart:
    spec:
      chart: seaweedfs
      version: "4.x"
      sourceRef:
        kind: HelmRepository
        name: seaweedfs
        namespace: seaweedfs
  values:
    global:
      seaweedfs:
        # replicationPlacement 010 = 1 extra copy on another RACK, not just
        # another node. pi4 is its own rack ("pi4-rack") and the two Pi 3s
        # share "pi3-rack", so this guarantees every replicated file has one
        # copy on pi4 - the strongest node, with a real SATA SSD bus.
        enableReplication: true
        replicationPlacement: "010"

    master:
      replicas: 1
      nodeSelector: |
        kubernetes.io/hostname: pi3-1
      data:
        type: hostPath
        hostPathPrefix: /mnt/longhorn-disk1/seaweedfs-master
      logs:
        type: hostPath
        hostPathPrefix: /mnt/longhorn-disk1/seaweedfs-master
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 160Mi

    filer:
      replicas: 1
      # Prefer pi4's rack when there's a choice of which replica to read
      # from or write to first - fastest node, least contention.
      dataCenter: ""
      rack: pi4-rack
      nodeSelector: |
        kubernetes.io/hostname: pi3-1
      data:
        type: hostPath
        hostPathPrefix: /mnt/longhorn-disk1/seaweedfs-filer
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 384Mi

    # S3-compatible gateway - lets us generate presigned download links for
    # individual NAS files. A SeaweedFS "bucket" is just a top-level
    # directory under the filer, so nas-data's PVC already is one, no
    # separate storage needed. Auth keys live in an out-of-band Secret
    # (seaweedfs-s3-credentials, created via kubectl - not committed here,
    # same pattern as nas-samba-credentials).
    s3:
      enabled: true
      enableAuth: true
      credentials:
        admin:
          existingSecret: seaweedfs-s3-credentials
          accessKeyKey: admin_access_key_id
          secretKeyKey: admin_secret_access_key
      nodeSelector: |
        kubernetes.io/hostname: pi3-1
      logs:
        type: emptyDir
      resources:
        requests:
          cpu: 50m
          memory: 48Mi
        limits:
          # Buffers a full object in memory rather than streaming to the
          # client, so this needs headroom above the largest file it
          # serves (currently up to ~140MB on the NAS share).
          memory: 256Mi

    # Single default volume group disabled in favor of one named group per
    # physical disk below, each pinned to the node that disk is on.
    volume:
      enabled: false

    # Every group below carries a "verify-real-disk" initContainer: without
    # it, a disconnected USB disk's hostPath would silently fall back to an
    # empty directory on the node's SD card instead of failing. The
    # required marker file (`.real-disk-marker`, not committed - see
    # README) must exist at the disk's root or the pod refuses to start.
    volumes:
      pi3-1-disk1:
        replicas: 1
        rack: pi3-rack
        nodeSelector: |
          kubernetes.io/hostname: pi3-1
        initContainers: |
          - name: verify-real-disk
            image: busybox
            command: ["sh", "-c", "test -f /data1/.real-disk-marker || (echo 'FATAL: /data1 has no .real-disk-marker - the physical disk is likely disconnected and this would silently fall back to writing on the SD card. Refusing to start.' >&2 && exit 1)"]
            volumeMounts:
              - name: data1
                mountPath: /data1
        dataDirs:
          - name: data1
            type: hostPath
            hostPathPrefix: /mnt/longhorn-disk1
            maxVolumes: 0
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 160Mi
      pi3-2-disk1:
        replicas: 1
        rack: pi3-rack
        nodeSelector: |
          kubernetes.io/hostname: pi3-2
        initContainers: |
          - name: verify-real-disk
            image: busybox
            command: ["sh", "-c", "test -f /data1/.real-disk-marker || (echo 'FATAL: /data1 has no .real-disk-marker - the physical disk is likely disconnected and this would silently fall back to writing on the SD card. Refusing to start.' >&2 && exit 1)"]
            volumeMounts:
              - name: data1
                mountPath: /data1
        dataDirs:
          - name: data1
            type: hostPath
            hostPathPrefix: /mnt/longhorn-disk1
            maxVolumes: 0
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 160Mi
      pi4-disk1:
        replicas: 1
        rack: pi4-rack
        nodeSelector: |
          kubernetes.io/hostname: pi4
        initContainers: |
          - name: verify-real-disk
            image: busybox
            command: ["sh", "-c", "test -f /data1/.real-disk-marker || (echo 'FATAL: /data1 has no .real-disk-marker - the physical disk is likely disconnected and this would silently fall back to writing on the SD card. Refusing to start.' >&2 && exit 1)"]
            volumeMounts:
              - name: data1
                mountPath: /data1
        dataDirs:
          - name: data1
            type: hostPath
            hostPathPrefix: /mnt/longhorn-disk1
            maxVolumes: 0
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 160Mi
      pi4-disk2:
        replicas: 1
        rack: pi4-rack
        nodeSelector: |
          kubernetes.io/hostname: pi4
        initContainers: |
          - name: verify-real-disk
            image: busybox
            command: ["sh", "-c", "test -f /data1/.real-disk-marker || (echo 'FATAL: /data1 has no .real-disk-marker - the physical disk is likely disconnected and this would silently fall back to writing on the SD card. Refusing to start.' >&2 && exit 1)"]
            volumeMounts:
              - name: data1
                mountPath: /data1
        dataDirs:
          - name: data1
            type: hostPath
            hostPathPrefix: /mnt/longhorn-disk2
            maxVolumes: 0
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 160Mi
      pi4-wd:
        replicas: 1
        rack: pi4-rack
        nodeSelector: |
          kubernetes.io/hostname: pi4
        initContainers: |
          - name: verify-real-disk
            image: busybox
            command: ["sh", "-c", "test -f /data1/.real-disk-marker || (echo 'FATAL: /data1 has no .real-disk-marker - the physical disk is likely disconnected and this would silently fall back to writing on the SD card. Refusing to start.' >&2 && exit 1)"]
            volumeMounts:
              - name: data1
                mountPath: /data1
        dataDirs:
          - name: data1
            type: hostPath
            hostPathPrefix: /mnt/fast-storage
            maxVolumes: 0
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 160Mi
