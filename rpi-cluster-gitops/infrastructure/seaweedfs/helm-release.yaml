# Master + filer are pinned to pi3-1 rather than pi4: pi4 already carries
# the k3s control-plane and Home Assistant, so it has less real headroom
# than its total RAM suggests. Volume servers run once per physical disk -
# pi4 hosts two SSDs and pi3-1 two, since data has to live where the disk physically is.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs
  namespace: seaweedfs
spec:
  interval: 1h
  chart:
    spec:
      chart: seaweedfs
      version: "4.48.0" # pinned: chart 4.49.0 pointed at an image tag that was not published, which took the NAS down
      sourceRef:
        kind: HelmRepository
        name: seaweedfs
        namespace: seaweedfs
  values:
    global:
      seaweedfs:
        # replicationPlacement 010 = 1 extra copy in another RACK. Every disk is
        # its own rack, so the two copies of any volume always sit on two
        # different disks, whichever they are (a disk failure loses nothing).
        enableReplication: true
        replicationPlacement: "010"

    master:
      replicas: 1
      nodeSelector: |
        kubernetes.io/hostname: pi3-1
      data:
        type: hostPath
        hostPathPrefix: /mnt/longhorn-disk1/seaweedfs-master
      logs:
        type: hostPath
        hostPathPrefix: /mnt/longhorn-disk1/seaweedfs-master
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 160Mi

    filer:
      replicas: 1
      # Runs on phone-1: the Pis ran out of memory and the OOM killer took the
      # filer down, which left the NAS mounts dead. Metadata (about 20 MB) is a
      # hostPath on the phone; the volume data stays on the SSDs.
      nodeSelector: |
        kubernetes.io/hostname: phone-1
      tolerations: |
        - key: node-type
          operator: Equal
          value: phone
          effect: NoSchedule
      data:
        type: hostPath
        hostPathPrefix: /var/lib/seaweedfs-filer
      # Large uploads buffer chunks here; 384Mi was OOM-killed on multi-GB transfers, and the
      # phone has about 4 GB free.
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 1Gi

    # S3-compatible gateway - lets us generate presigned download links for
    # individual NAS files. A SeaweedFS "bucket" is just a top-level
    # directory under the filer, so nas-data's PVC already is one, no
    # separate storage needed. Auth keys live in a Secret
    # (seaweedfs-s3-credentials, SOPS-encrypted in s3-credentials.sops.yaml).
    s3:
      enabled: true
      enableAuth: true
      credentials:
        admin:
          existingSecret: seaweedfs-s3-credentials
          accessKeyKey: admin_access_key_id
          secretKeyKey: admin_secret_access_key
      nodeSelector: |
        kubernetes.io/hostname: pi4
      logs:
        type: emptyDir
      resources:
        requests:
          cpu: 50m
          memory: 48Mi
        limits:
          # Buffers a full object in memory rather than streaming to the
          # client, so this needs headroom above the largest file it
          # serves (currently up to ~140MB on the NAS share).
          memory: 256Mi

    # Single default volume group disabled in favor of one named group per
    # physical disk below, each pinned to the node that disk is on.
    volume:
      enabled: false
      # The chart only renders a group's own initContainers when this base value is
      # non-empty, so without it the verify-real-disk guards below were silently dropped
      # and a volume server could start on an unmounted disk (the SD card). Every group
      # overrides it.
      initContainers: "[]"

    # Every group below carries a "verify-real-disk" initContainer: without
    # it, a disconnected USB disk's hostPath would silently fall back to an
    # empty directory on the node's SD card instead of failing. The
    # required marker file (`.real-disk-marker`, not committed - see
    # README) must exist in the disk's object_store folder (the chart mounts that folder, not the disk root) or the pod refuses to start.
    volumes:
      pi3-1-disk1:
        replicas: 1
        rack: pi3-1-disk1
        nodeSelector: |
          kubernetes.io/hostname: pi3-1
        initContainers: |
          - name: verify-real-disk
            image: busybox
            command: ["sh", "-c", "test -f /data1/.real-disk-marker || (echo 'FATAL: /data1 has no .real-disk-marker - the physical disk is likely disconnected and this would silently fall back to writing on the SD card. Refusing to start.' >&2 && exit 1)"]
            volumeMounts:
              - name: data1
                mountPath: /data1
        dataDirs:
          - name: data1
            type: hostPath
            hostPathPrefix: /mnt/longhorn-disk1
            maxVolumes: 0
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
      pi3-2-disk1:
        replicas: 1
        rack: pi3-2-disk1
        nodeSelector: |
          kubernetes.io/hostname: pi3-2
        initContainers: |
          - name: verify-real-disk
            image: busybox
            command: ["sh", "-c", "test -f /data1/.real-disk-marker || (echo 'FATAL: /data1 has no .real-disk-marker - the physical disk is likely disconnected and this would silently fall back to writing on the SD card. Refusing to start.' >&2 && exit 1)"]
            volumeMounts:
              - name: data1
                mountPath: /data1
        dataDirs:
          - name: data1
            type: hostPath
            hostPathPrefix: /mnt/longhorn-disk1
            maxVolumes: 0
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
      pi4-disk1:
        replicas: 1
        rack: pi4-disk1
        nodeSelector: |
          kubernetes.io/hostname: pi4
        initContainers: |
          - name: verify-real-disk
            image: busybox
            command: ["sh", "-c", "test -f /data1/.real-disk-marker || (echo 'FATAL: /data1 has no .real-disk-marker - the physical disk is likely disconnected and this would silently fall back to writing on the SD card. Refusing to start.' >&2 && exit 1)"]
            volumeMounts:
              - name: data1
                mountPath: /data1
        dataDirs:
          - name: data1
            type: hostPath
            hostPathPrefix: /mnt/longhorn-disk1
            maxVolumes: 0
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
      pi4-disk2:
        replicas: 1
        rack: pi4-disk2
        nodeSelector: |
          kubernetes.io/hostname: pi4
        initContainers: |
          - name: verify-real-disk
            image: busybox
            command: ["sh", "-c", "test -f /data1/.real-disk-marker || (echo 'FATAL: /data1 has no .real-disk-marker - the physical disk is likely disconnected and this would silently fall back to writing on the SD card. Refusing to start.' >&2 && exit 1)"]
            volumeMounts:
              - name: data1
                mountPath: /data1
        dataDirs:
          - name: data1
            type: hostPath
            hostPathPrefix: /mnt/longhorn-disk2
            maxVolumes: 0
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
      pi3-1-wd:
        replicas: 1
        rack: pi3-1-wd
        nodeSelector: |
          kubernetes.io/hostname: pi3-1
        initContainers: |
          - name: verify-real-disk
            image: busybox
            command: ["sh", "-c", "test -f /data1/.real-disk-marker || (echo 'FATAL: /data1 has no .real-disk-marker - the physical disk is likely disconnected and this would silently fall back to writing on the SD card. Refusing to start.' >&2 && exit 1)"]
            volumeMounts:
              - name: data1
                mountPath: /data1
        dataDirs:
          - name: data1
            type: hostPath
            hostPathPrefix: /mnt/fast-storage
            maxVolumes: 0
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 160Mi
