# Detects a stale SeaweedFS FUSE mount under an already-running pod (the
# pod stays Running/Ready since its own process never crashed, so a
# liveness probe won't catch it) and force-deletes the pod so the
# Deployment recreates it and the CSI driver re-establishes the mount.
#
# nas-samba's check uses a real SMB connection (smbclient) rather than
# `kubectl exec`: exec always spawns a fresh process with a fresh path
# lookup, so it can't see staleness held in smbd's own long-lived worker
# processes - only a genuine SMB connection exercises that.
#
# Every check has a timeout, the Job has activeDeadlineSeconds, and each
# check retries a few times before deleting a pod - a mount hang can
# block in D-state indefinitely, and a pod that just restarted can still
# be finishing startup (e.g. smbd provisioning its user) even after
# logging ready; a genuinely broken mount fails every retry regardless.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mount-watchdog
  namespace: mount-watchdog
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      activeDeadlineSeconds: 150
      template:
        spec:
          serviceAccountName: mount-watchdog
          restartPolicy: OnFailure
          containers:
            - name: watchdog
              image: alpine/k8s:1.31.1
              env:
                - name: NAS_SMB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: nas-samba-credentials
                      key: password
              command:
                - /bin/sh
                - -c
                - |
                  set -u
                  apk add --no-cache samba-client >/dev/null 2>&1

                  # Runs $@ up to 3 times (5s apart), succeeding on the first pass.
                  retry() {
                    local i
                    for i in 1 2 3; do
                      "$@" >/dev/null 2>&1 && return 0
                      [ "$i" -lt 3 ] && sleep 5
                    done
                    return 1
                  }

                  check_and_heal() {
                    local ns="$1" label="$2" mount_path="$3" container="${4:-}"
                    local pod
                    pod=$(kubectl get pods -n "$ns" -l "$label" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
                    if [ -z "$pod" ]; then
                      echo "[$ns] no pod found for $label, skipping"
                      return
                    fi
                    local c_arg=""
                    [ -n "$container" ] && c_arg="-c $container"
                    if retry timeout 15 kubectl exec -n "$ns" "$pod" $c_arg -- stat "$mount_path"; then
                      echo "[$ns/$pod] mount healthy"
                    else
                      echo "[$ns/$pod] mount check FAILED after retries - deleting pod to force a fresh mount"
                      kubectl delete pod -n "$ns" "$pod" --force --grace-period=0
                    fi
                  }

                  check_nas_and_heal() {
                    local ns="nas" label="app=nas-samba"
                    local pod pod_ip
                    pod=$(kubectl get pods -n "$ns" -l "$label" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
                    if [ -z "$pod" ]; then
                      echo "[$ns] no pod found for $label, skipping"
                      return
                    fi
                    pod_ip=$(kubectl get pod -n "$ns" "$pod" -o jsonpath='{.status.podIP}' 2>/dev/null)
                    if retry timeout 15 smbclient "//$pod_ip/share" -U "Miro%$NAS_SMB_PASSWORD" -c "ls"; then
                      echo "[$ns/$pod] mount healthy (real SMB check)"
                    else
                      echo "[$ns/$pod] SMB check FAILED after retries - deleting pod to force a fresh mount"
                      kubectl delete pod -n "$ns" "$pod" --force --grace-period=0
                    fi
                  }

                  check_nas_and_heal
                  check_and_heal web-server app=web-server /git nginx
                  check_and_heal site-counters app=site-counters /data
              resources:
                requests:
                  cpu: 25m
                  memory: 48Mi
                limits:
                  memory: 96Mi
