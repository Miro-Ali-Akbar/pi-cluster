# Watches for the "transport endpoint not connected" / "socket not
# connected" failure that happens when SeaweedFS's FUSE mount process
# crashes (e.g. under a heavy bulk upload) and restarts: the mount point
# used by an already-running pod goes stale, but the pod itself keeps
# reporting Running/Ready since its own process never crashed.
#
# A plain liveness probe can't fix this: it only restarts the failing
# *container*, but kubelet sets up volume mounts once per *pod* at
# creation time - restarting a container inside an already-running pod
# reuses the same (still-dead) mount. Only deleting the whole pod, so the
# Deployment recreates it fresh and the CSI driver re-establishes the
# mount from scratch, actually clears it - the same thing done manually
# to recover the NAS/web-server/site-counters outage this was written
# after.
#
# nas-samba's check connects over the real SMB protocol (smbclient),
# rather than `kubectl exec`-ing into the pod at all. Checking as smbuser
# via exec (an earlier fix) still wasn't enough: `kubectl exec` always
# spawns a brand-new process, which does a fresh path lookup and succeeds
# against whatever mount is CURRENTLY valid - it can never see the
# staleness in smbd's own already-running, long-lived worker processes,
# which hold a *stale* reference from before a mount change and are what
# real clients actually hit. Only a genuine SMB connection - the same
# thing a real client does - exercises that specific broken state.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mount-watchdog
  namespace: mount-watchdog
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: mount-watchdog
          restartPolicy: OnFailure
          containers:
            - name: watchdog
              image: alpine/k8s:1.31.1
              env:
                - name: NAS_SMB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: nas-samba-credentials
                      key: password
              command:
                - /bin/sh
                - -c
                - |
                  set -u
                  apk add --no-cache samba-client >/dev/null 2>&1

                  check_and_heal() {
                    local ns="$1" label="$2" mount_path="$3" container="${4:-}"
                    local pod
                    pod=$(kubectl get pods -n "$ns" -l "$label" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
                    if [ -z "$pod" ]; then
                      echo "[$ns] no pod found for $label, skipping"
                      return
                    fi
                    local c_arg=""
                    [ -n "$container" ] && c_arg="-c $container"
                    if kubectl exec -n "$ns" "$pod" $c_arg -- stat "$mount_path" >/dev/null 2>&1; then
                      echo "[$ns/$pod] mount healthy"
                    else
                      echo "[$ns/$pod] mount check FAILED - deleting pod to force a fresh mount"
                      kubectl delete pod -n "$ns" "$pod" --force --grace-period=0
                    fi
                  }

                  # Real SMB connection to whatever real IP the pod is
                  # currently on (hostNetwork), exercising the actual
                  # already-running smbd - see the top comment for why a
                  # kubectl-exec-based check can't catch this.
                  check_nas_and_heal() {
                    local ns="nas" label="app=nas-samba"
                    local pod pod_ip
                    pod=$(kubectl get pods -n "$ns" -l "$label" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
                    if [ -z "$pod" ]; then
                      echo "[$ns] no pod found for $label, skipping"
                      return
                    fi
                    pod_ip=$(kubectl get pod -n "$ns" "$pod" -o jsonpath='{.status.podIP}' 2>/dev/null)
                    if smbclient "//$pod_ip/share" -U "Miro%$NAS_SMB_PASSWORD" -c "ls" >/dev/null 2>&1; then
                      echo "[$ns/$pod] mount healthy (real SMB check)"
                    else
                      echo "[$ns/$pod] SMB check FAILED - deleting pod to force a fresh mount"
                      kubectl delete pod -n "$ns" "$pod" --force --grace-period=0
                    fi
                  }

                  check_nas_and_heal
                  check_and_heal web-server app=web-server /git nginx
                  check_and_heal site-counters app=site-counters /data
              resources:
                requests:
                  cpu: 25m
                  memory: 48Mi
                limits:
                  memory: 96Mi
