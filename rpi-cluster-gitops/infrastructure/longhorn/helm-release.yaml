# Requires open-iscsi/iscsid installed on every node — see rpi-cluster-ansible/local.yml.
# Run Longhorn's environment-check DaemonSet against all nodes before first install
# (see plan.md step 4.1).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 1h
  chart:
    spec:
      chart: longhorn
      version: "1.7.x"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: longhorn-system
  values:
    # Longhorn's chart defaults to 3 replicas each of the CSI sidecars
    # (attacher/provisioner/resizer/snapshotter = 12 pods), meant for HA
    # across many nodes. On this single 2GB Pi 4 that's enough CPU/memory
    # contention to starve everything else (Flux, Home Assistant) and cause
    # kubelet heartbeat misses -> spurious NodeNotReady. One replica each is
    # correct until there are enough nodes to make redundancy meaningful.
    csi:
      attacherReplicaCount: 1
      provisionerReplicaCount: 1
      resizerReplicaCount: 1
      snapshotterReplicaCount: 1
    # Dashboard UI, not needed for storage to function - never used, disabled
    # entirely to free up its memory footprint on the 2GB node.
    longhornUI:
      replicas: 0
    defaultSettings:
      # Only the two Pi 3 workers are storage-eligible; the Pi 4 control-plane
      # node is excluded (see plan.md's numberOfReplicas discussion — this is
      # the practical ceiling with two storage-eligible nodes).
      defaultReplicaCount: 2
      replicaAutoBalance: best-effort
      createDefaultDiskLabeledNodes: true
    # Pi 3 nodes have 1 GB RAM total — Longhorn's own guidance assumes >=4 GB.
    # Cap engine/replica resource usage explicitly rather than letting them float.
    longhornManager:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 256Mi
    longhornDriver:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
