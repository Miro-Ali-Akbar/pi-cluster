apiVersion: apps/v1
kind: Deployment
metadata:
  name: headscale
  namespace: headscale
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: headscale
  template:
    metadata:
      labels:
        app: headscale
      annotations:
        config-revision: "2"
    spec:
      nodeSelector:
        kubernetes.io/hostname: phone-1 # the database lives in a hostPath here
      tolerations:
        - key: node-type
          operator: Equal
          value: phone
          effect: NoSchedule
      containers:
        - name: headscale
          image: docker.io/headscale/headscale:v0.29.7@sha256:8f64e19972c001efa48be48a9d81a2f86c4f239767ee3ffd50de119b01fe96f1
          args: ["serve"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/headscale
              readOnly: true
            - name: data
              mountPath: /var/lib/headscale
            - name: run
              mountPath: /var/run/headscale
      volumes:
        - name: config
          configMap:
            name: headscale-config
        - name: data
          hostPath:
            path: /var/lib/headscale
            type: DirectoryOrCreate
        - name: run
          emptyDir: {}
