# Self-hosted Tailscale control server. Based on config-example.yaml of headscale v0.29.7.
# server_url must be the public https name clients log in to (proxied by edge-proxy).
apiVersion: v1
kind: ConfigMap
metadata:
  name: headscale-config
  namespace: headscale
data:
  config.yaml: |
    server_url: https://hs.miro.zip
    listen_addr: 0.0.0.0:8080
    metrics_listen_addr: 0.0.0.0:9090
    grpc_listen_addr: 127.0.0.1:50443
    grpc_allow_insecure: false
    noise:
      private_key_path: /var/lib/headscale/noise_private.key
    prefixes:
      v4: 100.64.0.0/10
      v6: fd7a:115c:a1e0::/48
      allocation: sequential
    derp:
      server:
        enabled: false
      urls:
        - https://controlplane.tailscale.com/derpmap/default
      paths: []
      auto_update_enabled: true
      update_frequency: 3h
    disable_check_updates: true
    node:
      expiry: 0
    database:
      type: sqlite
      sqlite:
        path: /var/lib/headscale/db.sqlite
        write_ahead_log: true
    log:
      level: info
      format: text
    policy:
      mode: file
      path: ""
    dns:
      magic_dns: false
      base_domain: ts.miro.zip
      override_local_dns: false
      nameservers:
        global:
          - 1.1.1.1
