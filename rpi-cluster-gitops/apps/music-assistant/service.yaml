apiVersion: v1
kind: Service
metadata:
  name: music-assistant
  namespace: music-assistant
spec:
  # ClusterIP, not LoadBalancer: the pod runs with hostNetwork (for mDNS
  # discovery) and already binds 8095 directly on pi3-2's LAN IP, which
  # would collide with ServiceLB's own hostNetwork proxy pod on the same
  # node/port. External access is unchanged - same node IP:8095 either way.
  type: ClusterIP
  selector:
    app: music-assistant
  ports:
    - port: 8095
      targetPort: 8095
