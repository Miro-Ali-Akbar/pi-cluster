# `storage` here is a SeaweedFS collection quota, not one disk's size - it
# distributes across all registered volume servers. It's a PHYSICAL quota
# (counts every replica), so with 2x replication, usable logical space is
# roughly half this number.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nas-data
  namespace: nas
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: seaweedfs-storage
  resources:
    requests:
      storage: 620Gi
