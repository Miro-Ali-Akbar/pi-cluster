# NAS via Samba. Bulk-hdd storage is bus-limited to ~35-40 MB/s over the Pi 3's
# USB2 controller and the cluster's 10/100 Mbps switch (see plan.md's Critical
# Hardware Limitations) — set expectations accordingly, this is not a
# high-throughput file server.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nas-samba
  namespace: nas
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nas-samba
  template:
    metadata:
      labels:
        app: nas-samba
    spec:
      # Moved off pi3-2: the FUSE mount client (weed mount, which does all
      # the write chunking/hashing) runs on whichever node hosts this pod,
      # and pi3-2 was doing that PLUS being an SMB server PLUS hosting
      # web-server/site-counters PLUS one of the two data replicas - a
      # bulk transfer stacked all of that onto one Pi 3 and drove its load
      # average past 30. pi4 has double the RAM, a faster CPU, and nothing
      # else competing for it.
      nodeSelector:
        kubernetes.io/hostname: pi4
      # SMB needs to be reachable from real LAN clients (phones, laptops),
      # not just other pods - same reasoning as HA/matter-server's hostNetwork.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: samba
          image: dperson/samba
          # Guest access (no password) worked from Linux/Mac but Windows
          # blocks passwordless SMB guest logons by default - real
          # credentials fix that and close the open-to-anyone-on-the-LAN
          # gap. Password comes from a Secret created out-of-band (see
          # ha-cast-toggle-key for the same pattern), never committed here.
          args: ["-u", "Miro;$(SAMBA_PASSWORD)", "-s", "share;/share;yes;no;no;Miro"]
          env:
            - name: SAMBA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nas-samba-credentials
                  key: password
          ports:
            - containerPort: 445
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              # cpu limit added after nas-samba (moved here to pi4) helped
              # drive pi4's own k3s API server unresponsive during a bulk
              # transfer - with no cpu limit at all before this, smbd could
              # burst to consume as much CPU as the transfer demanded,
              # directly competing with k3s-server for cycles on the one
              # node that's also the control plane. Scoped to just this
              # pod rather than a node-wide kubelet reservation, which
              # would have throttled Home Assistant too.
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /share
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nas-data
