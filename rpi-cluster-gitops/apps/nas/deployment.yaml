# NAS via Samba, backed by the seaweedfs-storage StorageClass.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nas-samba
  namespace: nas
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nas-samba
  template:
    metadata:
      labels:
        app: nas-samba
    spec:
      nodeSelector:
        kubernetes.io/hostname: pi4
      # SMB needs to be reachable from real LAN clients (phones, laptops),
      # not just other pods - same reasoning as HA/matter-server's hostNetwork.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # /share can come back from a fresh FUSE mount as 0750 root:root
      # instead of 0777, which blocks smbd's chdir - fix it before smbd
      # starts so every pod recreate self-heals.
      initContainers:
        - name: fix-share-permissions
          image: dperson/samba
          command: ["chmod", "0777", "/share"]
          volumeMounts:
            - name: data
              mountPath: /share
      containers:
        - name: samba
          image: dperson/samba
          # Guest access (no password) worked from Linux/Mac but Windows
          # blocks passwordless SMB guest logons by default - real
          # credentials fix that and close the open-to-anyone-on-the-LAN
          # gap. Password comes from a Secret created out-of-band (see
          # ha-cast-toggle-key for the same pattern), never committed here.
          args: ["-u", "Miro;$(SAMBA_PASSWORD)", "-s", "share;/share;yes;no;no;Miro"]
          env:
            - name: SAMBA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nas-samba-credentials
                  key: password
          ports:
            - containerPort: 445
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              # Capped so a bulk transfer can't starve pi4's own k3s
              # API server for CPU - this pod's node is the control plane.
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /share
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nas-data
