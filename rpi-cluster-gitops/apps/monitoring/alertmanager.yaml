# Alerts go to a Home Assistant webhook, which sends a mobile notification
# (automation "cluster_alert" in the HA config on phone-1). The webhook URL is
# the only authentication on that endpoint, so it lives in the Secret
# alertmanager-webhook (key: url), created by hand and not stored in git.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    route:
      receiver: home-assistant
      group_by: [alertname, node]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 6h
    receivers:
      - name: home-assistant
        webhook_configs:
          - url_file: /etc/alertmanager-secret/url
            send_resolved: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      nodeSelector:
        kubernetes.io/hostname: phone-1
      tolerations:
        - key: node-type
          operator: Equal
          value: phone
          effect: NoSchedule
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.28.1
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/tmp/alertmanager
          ports:
            - containerPort: 9093
          securityContext:
            runAsUser: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: webhook
              mountPath: /etc/alertmanager-secret
              readOnly: true
            - name: tmp
              mountPath: /tmp/alertmanager
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: webhook
          secret:
            secretName: alertmanager-webhook
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  selector:
    app: alertmanager
  ports:
    - port: 9093
