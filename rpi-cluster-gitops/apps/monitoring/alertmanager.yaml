# Alerts go to a Home Assistant webhook, which sends a mobile notification
# (automation "cluster_alert" in the HA config on phone-1). The webhook URL is
# the only authentication on that endpoint, so it lives in the SOPS-encrypted
# Secret alertmanager-webhook (alertmanager-webhook.sops.yaml, key: url).
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    # One notification lists everything firing. Only the urgent ones (a node down, a site down,
    # the phone battery, an expiring certificate) may wake you: the rest is held 23:00-07:30.
    route:
      receiver: home-assistant
      group_by: []
      group_wait: 2m
      group_interval: 30m
      repeat_interval: 48h
      routes:
        - matchers:
            - alertname=~"NodeNotReady|ProbeFailed|PhoneBatteryLow|PhoneBatteryHot|CertExpiringSoon"
          group_by: [alertname]
          group_wait: 1m
          repeat_interval: 24h
        - matchers:
            - alertname=~".+"
          mute_time_intervals: [night]
    # A node that is down explains most of what else is firing.
    inhibit_rules:
      - source_matchers:
          - alertname="NodeNotReady"
        target_matchers:
          - alertname=~"DeploymentUnavailable|ScrapeTargetDown|SeaweedFSDown|SeaweedFSUnderReplicated|SeaweedFSDiskIOError|PodCrashLooping|UnitFailed|NodeMemoryLow"
    time_intervals:
      - name: night
        time_intervals:
          - times:
              - start_time: "23:00"
                end_time: "24:00"
              - start_time: "00:00"
                end_time: "07:30"
            location: Europe/Stockholm
    receivers:
      - name: home-assistant
        webhook_configs:
          - url_file: /etc/alertmanager-secret/url
            send_resolved: false
            http_config:
              tls_config:
                # HA serves HTTPS with a certificate for home.miro.zip; the
                # webhook is called by LAN IP, so the name cannot match.
                insecure_skip_verify: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
      annotations:
        config-revision: "3"
    spec:
      nodeSelector:
        kubernetes.io/hostname: phone-1
      tolerations:
        - key: node-type
          operator: Equal
          value: phone
          effect: NoSchedule
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.28.1
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/tmp/alertmanager
          ports:
            - containerPort: 9093
          securityContext:
            runAsUser: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: webhook
              mountPath: /etc/alertmanager-secret
              readOnly: true
            - name: tmp
              mountPath: /tmp/alertmanager
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: webhook
          secret:
            secretName: alertmanager-webhook
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  selector:
    app: alertmanager
  ports:
    - port: 9093
