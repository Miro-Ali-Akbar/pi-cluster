apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager.monitoring.svc:9093"]
    rule_files:
      - /etc/prometheus/rules.yml
    scrape_configs:
      - job_name: node
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [monitoring]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: node-exporter
            action: keep
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_host_ip]
            replacement: "$1:9100"
            target_label: __address__
      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics.monitoring.svc:8080"]
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
  rules.yml: |
    groups:
      - name: cluster
        rules:
          - alert: ScrapeTargetDown
            expr: up == 0
            for: 3m
            annotations:
              summary: "{{ $labels.job }} target {{ $labels.instance }} is down"
          - alert: NodeNotReady
            expr: kube_node_status_condition{condition="Ready",status="true"} == 0
            for: 3m
            annotations:
              summary: "Node {{ $labels.node }} is not Ready"
          - alert: NodeMemoryLow
            expr: node_memory_MemAvailable_bytes < 150 * 1024 * 1024
            for: 5m
            annotations:
              summary: "{{ $labels.node }} has {{ $value | humanize1024 }}B memory available"
          - alert: DiskAlmostFull
            expr: >
              node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs"}
              / node_filesystem_size_bytes{fstype=~"ext4|xfs|btrfs"} < 0.10
            for: 10m
            annotations:
              summary: "{{ $labels.node }} {{ $labels.mountpoint }} has under 10% free"
          - alert: PodCrashLooping
            expr: increase(kube_pod_container_status_restarts_total[30m]) > 3
            for: 5m
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} restarted {{ $value | printf \"%.0f\" }} times in 30 min"
          - alert: DeploymentUnavailable
            expr: kube_deployment_status_replicas_available < kube_deployment_spec_replicas
            for: 10m
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.deployment }} has fewer ready replicas than desired"
          - alert: PhoneBatteryLow
            expr: node_power_supply_capacity{power_supply="qcom-battery"} < 20
            for: 10m
            annotations:
              summary: "phone-1 battery at {{ $value }}% (charger or limiter problem)"
          - alert: PhoneBatteryHot
            expr: node_power_supply_temp_celsius{power_supply="qcom-battery"} > 45
            for: 5m
            annotations:
              summary: "phone-1 battery above 45 C"
