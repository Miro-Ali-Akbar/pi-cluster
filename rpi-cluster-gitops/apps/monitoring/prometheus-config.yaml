apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager.monitoring.svc:9093"]
    rule_files:
      - /etc/prometheus/rules.yml
    scrape_configs:
      - job_name: node
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [monitoring]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: node-exporter
            action: keep
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_host_ip]
            replacement: "$1:9100"
            target_label: __address__
      - job_name: seaweedfs
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [seaweedfs]
        relabel_configs:
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_service_name]
            regex: seaweedfs-filer-client
            action: drop
          - source_labels: [__meta_kubernetes_endpoint_hostname]
            target_label: pod
          - source_labels: [__meta_kubernetes_endpoint_node_name]
            target_label: node
      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics.monitoring.svc:8080"]
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
  rules.yml: |
    groups:
      - name: cluster
        rules:
          - alert: ScrapeTargetDown
            expr: up == 0
            for: 3m
            annotations:
              summary: "{{ $labels.job }} target {{ $labels.instance }} is down"
          - alert: SeaweedFSDown
            expr: up{job="seaweedfs"} == 0
            for: 3m
            annotations:
              summary: "SeaweedFS {{ $labels.pod }} is down (a disk or its node may have failed)"
          - alert: SeaweedFSUnderReplicated
            expr: sum(SeaweedFS_master_under_replicated_volumes) > 0
            for: 15m
            annotations:
              summary: "{{ $value }} SeaweedFS volumes have fewer than 2 copies"
          - alert: SeaweedFSDiskIOError
            expr: increase(SeaweedFS_volumeServer_storage_io_error_total[1h]) > 0
            annotations:
              summary: "SeaweedFS {{ $labels.pod }} reported disk I/O errors"
          - alert: SeaweedFSDiskFilling
            expr: >
              SeaweedFS_volumeServer_resource{type="avail"}
              / SeaweedFS_volumeServer_resource{type="all"} < 0.10
            for: 15m
            annotations:
              summary: "SeaweedFS {{ $labels.pod }} disk {{ $labels.name }} has under 10% free"
          - alert: DiskSmartFailed
            expr: smart_health_ok == 0
            for: 5m
            annotations:
              summary: "{{ $labels.node }} {{ $labels.device }} ({{ $labels.model }}) failed its SMART health check: replace it"
          - alert: DiskSectorsBad
            expr: smart_pending_sectors > 0 or increase(smart_reallocated_sectors[7d]) > 0
            annotations:
              summary: "{{ $labels.node }} {{ $labels.device }} ({{ $labels.model }}) has bad or growing reallocated sectors"
          - alert: DiskHot
            expr: smart_temperature_celsius > 60
            for: 15m
            annotations:
              summary: "{{ $labels.node }} {{ $labels.device }} is at {{ $value }} C"
          - alert: UnitFailed
            expr: unit_failed == 1
            for: 15m
            annotations:
              summary: "{{ $labels.node }}: {{ $labels.unit }} is in a failed state (check journalctl -u {{ $labels.unit }})"
          - alert: BackupStale
            expr: >
              time() - unit_last_exit_timestamp_seconds{unit="cluster-backup.service"} > 13 * 3600
              and unit_last_exit_timestamp_seconds{unit="cluster-backup.service"} > 0
            annotations:
              summary: "No cluster backup has run for over 13 hours (it should run every 6)"
          - alert: UnitHealthMissing
            expr: absent(unit_last_exit_timestamp_seconds{unit="cluster-backup.service"})
            for: 1h
            annotations:
              summary: "No unit-health metrics from phone-1: the backup and phone timers are not being watched"
          - alert: CertExpiringSoon
            expr: cert_expiry_seconds < 14 * 86400
            for: 1h
            annotations:
              summary: "TLS certificate for {{ $labels.target }} expires in {{ $value | humanizeDuration }} (renewal is failing)"
          - alert: CertProbeFailed
            expr: cert_probe_ok == 0
            for: 1h
            annotations:
              summary: "Could not read the TLS certificate served for {{ $labels.target }}"
          - alert: NodeNotReady
            expr: kube_node_status_condition{condition="Ready",status="true"} == 0
            for: 3m
            annotations:
              summary: "Node {{ $labels.node }} is not Ready"
          - alert: NodeMemoryLow
            expr: node_memory_MemAvailable_bytes < 150 * 1024 * 1024
            for: 5m
            annotations:
              summary: "{{ $labels.node }} has {{ $value | humanize1024 }}B memory available"
          - alert: DiskAlmostFull
            expr: >
              node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs"}
              / node_filesystem_size_bytes{fstype=~"ext4|xfs|btrfs"} < 0.10
            for: 10m
            annotations:
              summary: "{{ $labels.node }} {{ $labels.mountpoint }} has under 10% free"
          - alert: PodCrashLooping
            expr: increase(kube_pod_container_status_restarts_total[30m]) > 3
            for: 5m
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} restarted {{ $value | printf \"%.0f\" }} times in 30 min"
          - alert: DeploymentUnavailable
            expr: kube_deployment_status_replicas_available < kube_deployment_spec_replicas
            for: 10m
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.deployment }} has fewer ready replicas than desired"
          - alert: PhoneBatteryLow
            expr: node_power_supply_capacity{power_supply="qcom-battery"} < 20
            for: 10m
            annotations:
              summary: "phone-1 battery at {{ $value }}% (charger or limiter problem)"
          - alert: PhoneBatteryHot
            expr: node_power_supply_temp_celsius{power_supply="qcom-battery"} > 45
            for: 5m
            annotations:
              summary: "phone-1 battery above 45 C"
