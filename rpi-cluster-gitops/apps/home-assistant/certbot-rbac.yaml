apiVersion: v1
kind: ServiceAccount
metadata:
  name: certbot-ha
  namespace: home-assistant
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: restart-home-assistant
  namespace: home-assistant
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: certbot-restart-home-assistant
  namespace: home-assistant
subjects:
  - kind: ServiceAccount
    name: certbot-ha
    namespace: home-assistant
roleRef:
  kind: Role
  name: restart-home-assistant
  apiGroup: rbac.authorization.k8s.io
