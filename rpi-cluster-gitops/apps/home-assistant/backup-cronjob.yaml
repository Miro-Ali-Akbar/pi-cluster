# Mirrors Home Assistant's own backup files (from its "Automatic backups"
# feature, configured in the UI - see rpi-cluster-gitops README) to a second
# directory every 6 hours. Longhorn (which previously let this land on a
# separate physical disk on pi3-1) was removed for resource reasons - both
# paths are hostPath on pi4 for now, which only guards against accidental
# deletion/corruption within HA's own config, not a physical disk failure.
# Revisit with a real off-node copy (e.g. rsync over SSH to another node)
# when resilience work resumes.
#
# --delete mirrors HA's own retention (set in its Automatic backups UI) onto
# the destination, rather than requiring a second, separately-managed
# retention policy here.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: home-assistant-backup-copy
  namespace: home-assistant
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          nodeSelector:
            node-role: control-plane
          restartPolicy: OnFailure
          containers:
            - name: rsync
              image: alpine:3.20
              command:
                - sh
                - -c
                - |
                  set -e
                  apk add --no-cache rsync
                  rsync -a --delete /source/ /destination/
                  echo "Backup copy complete: $(ls /destination | wc -l) file(s)"
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: config
                  mountPath: /source
                  subPath: backups
                  readOnly: true
                - name: backups
                  mountPath: /destination
          volumes:
            - name: config
              hostPath:
                path: /var/lib/home-assistant/config
                type: Directory
            - name: backups
              hostPath:
                path: /var/lib/home-assistant/backups-mirror
                type: DirectoryOrCreate
