# Mirrors HA's own backup files (from its "Automatic backups" feature,
# configured in the UI) onto a SeaweedFS PVC every 6 hours, for redundancy
# across physical disks/nodes. HA's live config stays on hostPath - bulk
# small-file writes over the FUSE mount aren't reliable enough for that.
# --delete mirrors HA's own retention onto the destination instead of
# managing a second retention policy here.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: home-assistant-backup-copy
  namespace: home-assistant
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          # Reads the config hostPath on phone-1 and writes to the SeaweedFS
          # volume, which the CSI node/mount DaemonSets provide on phone-1.
          nodeSelector:
            kubernetes.io/hostname: phone-1
          tolerations:
            - key: node-type
              operator: Equal
              value: phone
              effect: NoSchedule
          restartPolicy: OnFailure
          containers:
            - name: rsync
              image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
              command:
                - sh
                - -c
                - |
                  set -e
                  apk add --no-cache rsync
                  rsync -a --delete /source/ /destination/
                  echo "Backup copy complete: $(ls /destination | wc -l) file(s)"
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: config
                  mountPath: /source
                  subPath: backups
                  readOnly: true
                - name: backups
                  mountPath: /destination
          volumes:
            - name: config
              hostPath:
                path: /var/lib/home-assistant/config
                type: Directory
            - name: backups
              persistentVolumeClaim:
                claimName: home-assistant-backups
