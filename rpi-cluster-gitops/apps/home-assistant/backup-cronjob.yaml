# Mirrors Home Assistant's own backup files (from its "Automatic backups"
# feature, configured in the UI - see rpi-cluster-gitops README) onto a
# SeaweedFS-backed PVC every 6 hours - genuine redundancy across different
# physical disks/nodes, without touching HA's own live config (which stays
# on hostPath: bulk small-file writes through the FUSE mount proved
# unreliable there, but this job's periodic "copy the newest backup file(s)"
# write is much lighter and a safe fit for SeaweedFS).
#
# --delete mirrors HA's own retention (set in its Automatic backups UI) onto
# the destination, rather than requiring a second, separately-managed
# retention policy here.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: home-assistant-backup-copy
  namespace: home-assistant
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          nodeSelector:
            node-role: control-plane
          restartPolicy: OnFailure
          containers:
            - name: rsync
              image: alpine:3.20
              command:
                - sh
                - -c
                - |
                  set -e
                  apk add --no-cache rsync
                  rsync -a --delete /source/ /destination/
                  echo "Backup copy complete: $(ls /destination | wc -l) file(s)"
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: config
                  mountPath: /source
                  subPath: backups
                  readOnly: true
                - name: backups
                  mountPath: /destination
          volumes:
            - name: config
              hostPath:
                path: /var/lib/home-assistant/config
                type: Directory
            - name: backups
              persistentVolumeClaim:
                claimName: home-assistant-backups
