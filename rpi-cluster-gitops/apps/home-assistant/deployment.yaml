apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate # one pod owns the config directory on the node - never two at once
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      # Runs on the phone: the Pis are memory-starved, the phone has 8 GB.
      # Config and certificates live in hostPaths on phone-1 (see
      # rpi-cluster-ansible/phone-1/README.md); backups go to SeaweedFS.
      nodeSelector:
        kubernetes.io/hostname: phone-1
      tolerations:
        - key: node-type
          operator: Equal
          value: phone
          effect: NoSchedule
      # Needed for mDNS/zeroconf discovery (Thread border routers, Cast,
      # HomeKit, etc.) - from inside the flannel overlay, HA never sees
      # multicast traffic from the physical LAN at all. Matches the same
      # reasoning matter-server uses hostNetwork for.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:stable
          ports:
            - containerPort: 8123
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 768Mi
          # No host devices needed: Zigbee (ZHA) reaches the dongle through
          # ser2net on pi3-1, Matter and Thread are network services on
          # pi3-1, and Bluetooth comes from the bt-proxy pod (ESPHome native
          # API) instead of a local adapter.
          volumeMounts:
            - name: config
              mountPath: /config
            # /etc/letsencrypt/live/<domain>/*.pem are symlinks into
            # ../../archive/<domain>/ - mount the whole letsencrypt dir
            # (read-only) so those symlinks resolve, not just live/.
            - name: letsencrypt
              mountPath: /etc/letsencrypt
              readOnly: true
      volumes:
        - name: config
          hostPath:
            path: /var/lib/home-assistant/config
            type: Directory
        - name: letsencrypt
          hostPath:
            path: /etc/letsencrypt
            type: Directory
