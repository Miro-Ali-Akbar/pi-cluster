apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate # ReadWriteOnce PVC — avoid two pods mounting it at once
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      nodeSelector:
        node-role: control-plane # pin to the Pi 4 alongside its fast-ssd disk
      # Needed for mDNS/zeroconf discovery (Thread border routers, Cast,
      # HomeKit, etc.) - from inside the flannel overlay, HA never sees
      # multicast traffic from the physical LAN at all. Matches the same
      # reasoning matter-server uses hostNetwork for.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:stable
          ports:
            - containerPort: 8123
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 768Mi
          # Zigbee USB dongle (/dev/serial/by-id, /dev/ttyACM0) and the Pi's
          # onboard Bluetooth (hci0 via BlueZ over D-Bus) both need host device
          # access - privileged + mounting /dev and /run/dbus is the standard
          # pattern for this, since Bluetooth specifically goes through the
          # host's bluetoothd over D-Bus rather than a plain device file.
          securityContext:
            privileged: true
          volumeMounts:
            - name: config
              mountPath: /config
            - name: dev
              mountPath: /dev
            - name: dbus
              mountPath: /run/dbus
            # /etc/letsencrypt/live/<domain>/*.pem are symlinks into
            # ../../archive/<domain>/ - mount the whole letsencrypt dir
            # (read-only) so those symlinks resolve, not just live/.
            - name: letsencrypt
              mountPath: /etc/letsencrypt
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: dev
          hostPath:
            path: /dev
            type: Directory
        - name: dbus
          hostPath:
            path: /run/dbus
            type: Directory
        - name: letsencrypt
          hostPath:
            path: /etc/letsencrypt
            type: Directory
