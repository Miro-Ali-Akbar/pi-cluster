# Off-node/off-disk redundancy for HA's backup files - see backup-cronjob.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-backups
  namespace: home-assistant
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: seaweedfs-storage
  resources:
    requests:
      storage: 20Gi
