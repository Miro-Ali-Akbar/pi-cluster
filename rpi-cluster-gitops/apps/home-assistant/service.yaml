apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  # ClusterIP, not LoadBalancer: the pod runs with hostNetwork now (for
  # mDNS discovery) and already binds 8123 directly on pi4's LAN IP, which
  # would collide with ServiceLB's own hostNetwork proxy pod on the same
  # node/port. External access is unchanged - same node IP:8123 either way.
  type: ClusterIP
  selector:
    app: home-assistant
  ports:
    - port: 8123
      targetPort: 8123
