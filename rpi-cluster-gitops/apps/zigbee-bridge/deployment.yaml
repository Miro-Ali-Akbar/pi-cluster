# The Zigbee dongle is plugged into pi3-1, not phone-1 (where Home Assistant
# runs), so ser2net bridges it over the network instead of hostPath
# passthrough - same pattern as OTBR for the Thread radio. Exposes the
# serial device as a plain TCP socket; HA's ZHA integration connects via
# socket://192.168.0.104:6638. hostNetwork so the port is reachable at
# pi3-1's IP.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zigbee-bridge
  namespace: zigbee-bridge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zigbee-bridge
  template:
    metadata:
      labels:
        app: zigbee-bridge
    spec:
      nodeSelector:
        kubernetes.io/hostname: pi3-1 # pinned by hostname, not role - depends on the Zigbee dongle physically plugged into this specific node
      hostNetwork: true
      containers:
        - name: ser2net
          image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
          command:
            - sh
            - -c
            - |
              set -e
              # Retry: the pod must start even if the network is not up yet after a reboot.
              until apk add --no-cache ser2net iptables; do sleep 5; done
              # The port has no authentication and kickolduser lets any client replace the current one,
              # so only Home Assistant (phone-1) may connect. hostNetwork: these are the host's rules.
              iptables -C INPUT -p tcp --dport 6638 -s 192.168.0.179 -j ACCEPT 2>/dev/null || iptables -I INPUT 1 -p tcp --dport 6638 -s 192.168.0.179 -j ACCEPT
              iptables -C INPUT -p tcp --dport 6638 -j DROP 2>/dev/null || iptables -A INPUT -p tcp --dport 6638 -j DROP
              # ser2net listens on IPv6 too; Home Assistant uses IPv4, so drop every IPv6 client.
              ip6tables -C INPUT -p tcp --dport 6638 -j DROP 2>/dev/null || ip6tables -A INPUT -p tcp --dport 6638 -j DROP
              # Alpine 3.20 ships ser2net 3.5.1, which uses the classic plain-text
              # ser2net.conf format (port:state:timeout:device:serial-params) -
              # NOT the YAML config format added in ser2net 4.x.
              # kickolduser: a new connection replaces an old half-open one (after a Home Assistant
              # restart or a Wi-Fi blip), otherwise ser2net refuses ZHA until this pod restarts.
              cat > /etc/ser2net.conf << 'EOF'
              6638:raw:0:/dev/serial/by-id/usb-ITEAD_SONOFF_Zigbee_3.0_USB_Dongle_Plus_V2_20220713113305-if00:115200 8DATABITS NONE 1STOPBIT XONXOFF kickolduser
              EOF
              exec ser2net -c /etc/ser2net.conf -d
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: dev
              mountPath: /dev
      volumes:
        - name: dev
          hostPath:
            path: /dev
            type: Directory
