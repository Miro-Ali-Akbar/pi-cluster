# The Zigbee dongle is plugged into pi3-1, not pi4 (where Home Assistant
# runs), so ser2net bridges it over the network instead of hostPath
# passthrough - same pattern as OTBR for the Thread radio. Exposes the
# serial device as a plain TCP socket; HA's ZHA integration connects via
# socket://192.168.0.104:6638. hostNetwork so the port is reachable at
# pi3-1's IP.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zigbee-bridge
  namespace: zigbee-bridge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zigbee-bridge
  template:
    metadata:
      labels:
        app: zigbee-bridge
    spec:
      nodeSelector:
        kubernetes.io/hostname: pi3-1 # pinned by hostname, not role - depends on the Zigbee dongle physically plugged into this specific node
      hostNetwork: true
      containers:
        - name: ser2net
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              set -e
              apk add --no-cache ser2net
              # Alpine 3.20 ships ser2net 3.5.1, which uses the classic plain-text
              # ser2net.conf format (port:state:timeout:device:serial-params) -
              # NOT the YAML config format added in ser2net 4.x.
              cat > /etc/ser2net.conf << 'EOF'
              6638:raw:0:/dev/serial/by-id/usb-ITEAD_SONOFF_Zigbee_3.0_USB_Dongle_Plus_V2_20220713113305-if00:115200 8DATABITS NONE 1STOPBIT XONXOFF
              EOF
              exec ser2net -c /etc/ser2net.conf -d
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: dev
              mountPath: /dev
      volumes:
        - name: dev
          hostPath:
            path: /dev
            type: Directory
