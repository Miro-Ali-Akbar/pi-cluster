# matterjs-server exposes the same WebSocket API Home Assistant's Matter
# integration expects on 192.168.0.104:5580. Needs hostNetwork for
# mDNS-based device discovery/commissioning; pinned to pi3-1 for its
# physical Bluetooth/Thread hardware. BLE backend is D-Bus/BlueZ
# (NOBLE_BINDINGS=dbus), talking to the host's bluetoothd over /run/dbus -
# runs unprivileged, no direct HCI socket access needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matter-server
  namespace: matter-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: matter-server
  template:
    metadata:
      labels:
        app: matter-server
    spec:
      nodeSelector:
        kubernetes.io/hostname: pi3-1
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: matter-server
          image: ghcr.io/matter-js/matterjs-server:stable
          env:
            - name: NOBLE_BINDINGS
              value: "dbus"
            - name: BLUETOOTH_ADAPTER
              value: "0"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: dbus
              mountPath: /run/dbus
              readOnly: true
      volumes:
        - name: data
          hostPath:
            path: /var/lib/matterjs-server/data
            type: DirectoryOrCreate
        - name: dbus
          hostPath:
            path: /run/dbus
            type: Directory
