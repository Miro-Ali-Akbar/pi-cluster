# Matter server needs host networking for mDNS-based device discovery and
# commissioning - it can't work behind a normal ClusterIP/LoadBalancer
# Service. Pinned to pi3-1 (the worker) to keep load off the already-tight
# Pi 4 control-plane node.
#
# BLE is required to commission any brand-new, unprovisioned device (it has
# no IP connectivity yet, so BLE is the only way to hand it Wi-Fi/Thread
# credentials) - uses pi3-1's onboard Bluetooth (hci0) over D-Bus/BlueZ,
# same pattern as Home Assistant's own Bluetooth passthrough.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matter-server
  namespace: matter-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: matter-server
  template:
    metadata:
      labels:
        app: matter-server
    spec:
      nodeSelector:
        node-role: worker
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: matter-server
          image: ghcr.io/home-assistant-libs/python-matter-server:stable
          args:
            - --storage-path
            - /data
            - --bluetooth-adapter
            - "0"
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: dbus
              mountPath: /run/dbus
      volumes:
        - name: data
          hostPath:
            path: /var/lib/matter-server/data
            type: DirectoryOrCreate
        - name: dbus
          hostPath:
            path: /run/dbus
            type: Directory
