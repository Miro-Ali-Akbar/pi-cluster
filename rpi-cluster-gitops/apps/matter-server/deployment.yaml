# matterjs-server exposes the WebSocket API Home Assistant's Matter
# integration uses, on 192.168.0.179:5580. Runs on phone-1 with hostNetwork
# for mDNS discovery. The Thread devices are reached over IPv6 through the
# OTBR border router on pi3-1 (phone-1 learns the Thread prefix route from the
# router advertisements). No Bluetooth here: the phone has no BlueZ, so new
# devices cannot be commissioned over BLE from this pod. Fabric data lives in
# a hostPath on phone-1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matter-server
  namespace: matter-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: matter-server
  template:
    metadata:
      labels:
        app: matter-server
    spec:
      nodeSelector:
        kubernetes.io/hostname: phone-1
      tolerations:
        - key: node-type
          operator: Equal
          value: phone
          effect: NoSchedule
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: matter-server
          image: ghcr.io/matter-js/matterjs-server:stable
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          hostPath:
            path: /var/lib/matterjs-server/data
            type: DirectoryOrCreate
