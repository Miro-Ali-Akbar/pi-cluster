# matterjs-server exposes the WebSocket API Home Assistant's Matter
# integration uses, on 192.168.0.179:5580. Runs on phone-1 with hostNetwork
# for mDNS discovery. The Thread devices are reached over IPv6 through the
# OTBR border router on pi4 (phone-1 learns the Thread prefix route from the
# router advertisements). BLE commissioning goes through the phone's own
# Bluetooth: NOBLE_BINDINGS=dbus talks to the host's bluetoothd over
# /run/dbus, unprivileged, no direct HCI socket access needed. Fabric data
# lives in a hostPath on phone-1. The D-Bus mount exposes the whole system
# bus, so the container drops all capabilities and cannot gain privileges.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matter-server
  namespace: matter-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: matter-server
  template:
    metadata:
      labels:
        app: matter-server
    spec:
      nodeSelector:
        kubernetes.io/hostname: phone-1
      tolerations:
        - key: node-type
          operator: Equal
          value: phone
          effect: NoSchedule
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: matter-server
          image: ghcr.io/matter-js/matterjs-server:stable@sha256:54232d0d3e7dff5a54759469d2753399270412b4c30c55b31750a4595e4cb236
          env:
            - name: NOBLE_BINDINGS
              value: "dbus"
            - name: BLUETOOTH_ADAPTER
              value: "0"
            - name: LOG_LEVEL
              value: debug
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: dbus
              mountPath: /run/dbus
              readOnly: true
      volumes:
        - name: data
          hostPath:
            path: /var/lib/matterjs-server/data
            type: DirectoryOrCreate
        - name: dbus
          hostPath:
            path: /run/dbus
            type: Directory
