# Migrated from home-assistant-libs/python-matter-server (deprecated/archived
# June 2026 - Home Assistant itself moved to matter.js as of HA 9.0) to the
# matter.js team's own matterjs-server, a documented drop-in replacement:
# same WebSocket API on the same port, so Home Assistant's Matter
# integration needs no reconfiguration - it just keeps talking to
# 192.168.0.104:5580 as before.
#
# Started with a FRESH data directory rather than migrating the old one:
# the old server's fabric was already found reset/orphaned (a Sep 6 fabric
# ID change had silently dropped every previously-commissioned device), so
# there was nothing worth carrying over - devices need re-pairing either
# way, and a clean slate avoids inheriting that confusion.
#
# Needs host networking for mDNS-based device discovery and commissioning,
# same reasoning as before. Pinned to pi3-1 for the same physical
# Bluetooth/Thread hardware reasons as the old deployment.
#
# BLE backend: uses the D-Bus/BlueZ backend (NOBLE_BINDINGS=dbus), the
# project's own recommended option - talks to the host's bluetoothd over
# the same /run/dbus socket already mounted for HA's own Bluetooth
# passthrough, and crucially runs UNPRIVILEGED (unlike the old server's
# `privileged: true`, needed there for direct HCI socket access).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matter-server
  namespace: matter-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: matter-server
  template:
    metadata:
      labels:
        app: matter-server
    spec:
      nodeSelector:
        kubernetes.io/hostname: pi3-1
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: matter-server
          image: ghcr.io/matter-js/matterjs-server:stable
          env:
            - name: NOBLE_BINDINGS
              value: "dbus"
            - name: BLUETOOTH_ADAPTER
              value: "0"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: dbus
              mountPath: /run/dbus
              readOnly: true
      volumes:
        - name: data
          hostPath:
            path: /var/lib/matterjs-server/data
            type: DirectoryOrCreate
        - name: dbus
          hostPath:
            path: /run/dbus
            type: Directory
