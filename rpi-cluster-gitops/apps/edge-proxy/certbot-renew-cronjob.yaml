apiVersion: batch/v1
kind: CronJob
metadata:
  name: certbot-renew
  namespace: edge-proxy
spec:
  # Let's Encrypt certs are valid 90 days; certbot only actually renews
  # inside the last 30, so a daily check is cheap and keeps renewal timely.
  schedule: "17 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: certbot
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: pi3-2 # shares edge-proxy's hostPath webroot/cert dirs
          initContainers:
            - name: certbot-renew
              image: certbot/certbot:latest
              # No --webroot here: each certificate's renewal file decides how it renews. miro.zip and
              # file.miro.zip use the DuckDNS DNS-01 hooks (port 80 is refused from the internet).
              command:
                - certbot
                - renew
                - --deploy-hook
                - touch /shared/renewed
              env:
                - name: DUCKDNS_DOMAIN
                  value: "thearmorassistant"
                - name: DUCKDNS_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: duckdns-token
                      key: token
              volumeMounts:
                - name: acme-webroot
                  mountPath: /var/www/acme
                - name: tls-certs
                  mountPath: /etc/letsencrypt
                - name: hooks
                  mountPath: /scripts
                - name: shared
                  mountPath: /shared
          containers:
            - name: restart-if-renewed
              image: bitnami/kubectl:latest
              command:
                - sh
                - -c
                - |
                  if [ -f /shared/renewed ]; then
                    echo "Cert renewed, restarting edge-proxy"
                    kubectl rollout restart deployment/edge-proxy -n edge-proxy
                  else
                    echo "No renewal due"
                  fi
              volumeMounts:
                - name: shared
                  mountPath: /shared
          volumes:
            - name: acme-webroot
              hostPath:
                path: /srv/acme-webroot
                type: DirectoryOrCreate
            - name: tls-certs
              hostPath:
                path: /srv/tls-certs
                type: DirectoryOrCreate
            - name: hooks
              configMap:
                name: certbot-duckdns-hooks
                defaultMode: 0755
            - name: shared
              emptyDir: {}
