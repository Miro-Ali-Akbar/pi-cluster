apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-proxy-conf
  namespace: edge-proxy
data:
  # No proxy_pass trailing path on either location - lets nginx forward the
  # original request URI unchanged, since site-counters expects full
  # /api/... paths and web-server just serves files by path.
  nginx.conf: |
    # root, so the worker can read the root-owned cert/key files certbot
    # writes to the hostPath tls-certs volume once HTTPS is live.
    user root;
    events {}

    # SNI passthrough on :443, since the router can only forward external
    # 443 to one internal target - home.miro.zip (Home Assistant, which
    # terminates TLS itself with its own cert on 192.168.0.174:8123) and
    # miro.zip (terminated locally below, once a cert exists) share this
    # one port/IP by inspecting the unencrypted SNI hostname in the
    # ClientHello. ssl_preread reads that without decrypting anything, so
    # HA's own TLS session is untouched end to end.
    stream {
      map $ssl_preread_server_name $backend {
        home.miro.zip 192.168.0.174:8123;
        default        127.0.0.1:8443;
      }
      server {
        listen 443;
        proxy_pass $backend;
        ssl_preread on;
      }
    }

    http {
      server {
        listen 80;
        server_name miro.zip;

        # certbot webroot HTTP-01 challenge - served in plain HTTP even
        # after HTTPS is live, since Let's Encrypt validates over :80.
        location /.well-known/acme-challenge/ {
          root /var/www/acme;
        }

        # Cert exists now - send everything else to HTTPS.
        location / {
          return 301 https://$host$request_uri;
        }
      }

      # HTTPS for miro.zip, reached via the stream block's "default" route
      # above (127.0.0.1:8443).
      server {
        listen 127.0.0.1:8443 ssl;
        server_name miro.zip;
        ssl_certificate /etc/letsencrypt/live/miro.zip/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/miro.zip/privkey.pem;

        location /api/ {
          proxy_pass http://site-counters.site-counters.svc.cluster.local:8080;
          proxy_set_header Host $host;
          proxy_set_header Origin $http_origin;
        }

        location / {
          proxy_pass http://web-server.web-server.svc.cluster.local:80;
          proxy_set_header Host $host;
        }
      }
    }
