# NOT part of kustomization.yaml on purpose - one-time manual step
# (`kubectl apply -f certbot-issue-hs-job.yaml`), run once the CNAMEs
# `hs.miro.zip -> thearmorassistant.duckdns.org` and
# `_acme-challenge.hs.miro.zip -> _acme-challenge.thearmorassistant.duckdns.org`
# exist at Porkbun. Uses the same DNS-01 DuckDNS hooks as certbot-renew-cronjob.yaml,
# which then renews this cert too (`certbot renew` covers every cert in the store).
apiVersion: batch/v1
kind: Job
metadata:
  name: certbot-issue-hs
  namespace: edge-proxy
spec:
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: pi3-2 # shares edge-proxy's hostPath cert dir
      containers:
        - name: certbot-issue
          image: certbot/certbot:latest
          command:
            - certbot
            - certonly
            - --manual
            - --preferred-challenges
            - dns
            - --manual-auth-hook
            - python3 /scripts/auth-hook.py
            - --manual-cleanup-hook
            - python3 /scripts/cleanup-hook.py
            - -d
            - hs.miro.zip
            - --email
            - miro@impactsolution.se
            - --agree-tos
            - --non-interactive
          env:
            - name: DUCKDNS_DOMAIN
              value: "thearmorassistant"
            - name: DUCKDNS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: duckdns-token
                  key: token
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/letsencrypt
            - name: hooks
              mountPath: /scripts
      volumes:
        - name: tls-certs
          hostPath:
            path: /srv/tls-certs
            type: DirectoryOrCreate
        - name: hooks
          configMap:
            name: certbot-duckdns-hooks
            defaultMode: 0755
