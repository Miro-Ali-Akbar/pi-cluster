apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-server
  namespace: web-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: web-server
  template:
    metadata:
      labels:
        app: web-server
    spec:
      # Runs on the phone: it has the spare RAM the Pis lack, and the site is a
      # throwaway checkout of a public repo, so it needs no persistent volume.
      nodeSelector:
        kubernetes.io/hostname: phone-1
      tolerations:
        - key: node-type
          operator: Equal
          value: phone
          effect: NoSchedule
      # git-sync writes as its default uid/gid (65533) - fsGroup makes the
      # emptyDir group-writable to it. Checked-out files stay world-readable
      # (git's default), so nginx's worker (uid 101, not in that group)
      # can still read them fine.
      securityContext:
        fsGroup: 65533
      # Populate the checkout before nginx starts, so the first request after a
      # (re)start never sees an empty /git. The emptyDir is fresh on every pod
      # start, so a git lock left by a killed sync can never block the next one.
      initContainers:
        - name: git-sync-init
          image: registry.k8s.io/git-sync/git-sync:v4.2.4
          args:
            - --repo=https://github.com/Miro-Ali-Akbar/website.git
            - --ref=main
            - --root=/git
            - --link=website
            - --one-time
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /git
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /git
              readOnly: true
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.2.4
          args:
            - --repo=https://github.com/Miro-Ali-Akbar/website.git
            - --ref=main
            - --root=/git
            - --link=website
            - --period=60s
            # retry through DNS or network blips instead of exiting (default aborts on the first failed fetch)
            - --max-failures=-1
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /git
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 512Mi
        - name: conf
          configMap:
            name: web-server-conf
