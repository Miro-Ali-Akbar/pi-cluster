apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-server
  namespace: web-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: web-server
  template:
    metadata:
      labels:
        app: web-server
    spec:
      nodeSelector:
        node-role: worker # moved off pi4 to relieve its chronic memory pressure - Longhorn attaches the fast-ssd-backed PVC over the network regardless of which node the pod runs on
      # git-sync writes as its default uid/gid (65533) - fsGroup makes the
      # PVC group-writable to it. Checked-out files stay world-readable
      # (git's default), so nginx's worker (uid 101, not in that group)
      # can still read them fine.
      securityContext:
        fsGroup: 65533
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /git
              readOnly: true
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.2.4
          args:
            - --repo=https://github.com/Miro-Ali-Akbar/website.git
            - --branch=main
            - --root=/git
            - --link=website
            - --period=60s
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /git
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: web-server-data
        - name: conf
          configMap:
            name: web-server-conf
